<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IELTS Master - Quản Trị Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/Chart.js"></script>
</head>
<body class="bg-gray-50 dark:bg-zinc-950 dark:text-gray-100 min-h-screen">

  <header class="bg-white dark:bg-zinc-900 border-b dark:border-zinc-800 sticky top-0 z-40 shadow-sm px-4">
    <div class="max-w-7xl mx-auto h-16 flex justify-between items-center">
      <span class="font-extrabold text-lg text-[#cf1717]">⚙️ ADMIN DASHBOARD</span>
      <div class="flex items-center gap-2">
        <button onclick="openExamModal()" class="bg-[#cf1717] text-white font-bold px-3 py-1.5 rounded-lg text-xs">+ Tạo Bài Thi</button>
        <button onclick="handleLogout()" class="px-3 py-1.5 text-xs font-bold bg-gray-200 dark:bg-zinc-800 rounded-lg">Đăng xuất</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 space-y-8">
    
    <!-- PHỔ ĐIỂM KÈM BẢNG ĐIỂM TỪNG BÀI -->
    <section class="bg-white dark:bg-zinc-900 p-4 sm:p-6 rounded-2xl border dark:border-zinc-800 shadow-sm space-y-6">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-l-4 border-[#cf1717] pl-3">
        <h2 class="text-base sm:text-lg font-extrabold text-gray-900 dark:text-white">📊 Phổ Điểm & Bảng Điểm Học Sinh</h2>
        <select id="examSelectFilter" onchange="renderScoreChartAndTable()" class="p-2 text-xs rounded-lg border dark:bg-zinc-800 dark:border-zinc-700">
          <option value="">Chọn bài thi để xem...</option>
        </select>
      </div>

      <!-- Biểu đồ -->
      <div class="h-56 w-full">
        <canvas id="scoreChart"></canvas>
      </div>

      <!-- BẢNG ĐIỂM CHI TIẾT SINH VIÊN -->
      <div class="overflow-x-auto pt-4 border-t dark:border-zinc-800">
        <h3 class="font-bold text-sm text-gray-900 dark:text-white mb-3">📝 Danh Sách Sinh Viên Đã Nộp Bài</h3>
        <table class="w-full text-left text-xs">
          <thead class="bg-gray-100 dark:bg-zinc-800 uppercase text-[10px] text-gray-500">
            <tr>
              <th class="p-3">Họ và Tên</th>
              <th class="p-3">Ngày sinh</th>
              <th class="p-3">Điểm số</th>
              <th class="p-3">Thời gian làm</th>
              <th class="p-3">Ngày nộp</th>
            </tr>
          </thead>
          <tbody id="adminGradebookBody" class="divide-y divide-gray-100 dark:divide-zinc-800">
            <tr><td colspan="5" class="p-3 text-center text-gray-400">Vui lòng chọn bài thi ở danh sách trên.</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- QUẢN LÝ BÀI THI -->
    <section class="space-y-3">
      <h2 class="text-base sm:text-lg font-extrabold text-gray-900 dark:text-white border-l-4 border-[#cf1717] pl-3">📚 Quản Lý Bài Thi Reading</h2>
      <div id="adminExamList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </section>

  </main>

  <!-- MODAL TẠO BÀI THI -->
  <div id="examModal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white dark:bg-zinc-900 border dark:border-zinc-800 rounded-2xl p-6 w-full max-w-xl max-h-[90vh] overflow-y-auto space-y-4">
      <h3 id="examModalTitle" class="text-lg font-bold text-[#cf1717]">Tạo Bài Thi Mới</h3>
      <form onsubmit="handleSaveExam(event)" class="space-y-3 text-xs">
        <input type="hidden" id="editingExamId">
        <input type="text" id="examTitle" placeholder="Tên bài thi..." required class="w-full p-2.5 rounded-lg border dark:bg-zinc-800">
        <input type="text" id="examTopic" placeholder="Chủ đề (Topic)..." required class="w-full p-2.5 rounded-lg border dark:bg-zinc-800">
        <input type="number" id="examTime" placeholder="Thời gian (Phút)..." value="60" required class="w-full p-2.5 rounded-lg border dark:bg-zinc-800">
        <textarea id="examPassage" rows="4" placeholder="Đoạn văn Reading (HTML)..." required class="w-full p-2.5 rounded-lg border dark:bg-zinc-800 font-mono"></textarea>
        <textarea id="examQuestions" rows="4" placeholder="Danh sách câu hỏi (JSON)..." required class="w-full p-2.5 rounded-lg border dark:bg-zinc-800 font-mono"></textarea>
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeExamModal()" class="w-1/2 py-2 bg-gray-200 dark:bg-zinc-700 font-bold rounded-lg">Hủy</button>
          <button type="submit" class="w-1/2 py-2 bg-[#cf1717] text-white font-bold rounded-lg">Lưu Bài</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://klovtvjfvfenhkvifujy.supabase.co";
    const SUPABASE_KEY = "sb_publishable_WevQJCkdgfwbgnUoNu1SfA_Ec9hT49-";
    const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let chartInstance = null;
    let allExams = [];
    let allResults = [];

    async function checkAdmin() {
      const { data: { user } } = await sbClient.auth.getUser();
      if (!user) { window.location.href = 'index.html'; return; }

      const { data: profile } = await sbClient.from('profiles').select('role').eq('id', user.id).single();
      if (profile?.role !== 'admin') { window.location.href = 'dashboard.html'; return; }

      loadAdminExams();
      loadResultsWithProfiles();
    }

    async function loadAdminExams() {
      const { data: exams } = await sbClient.from('exams').select('*').order('created_at', { ascending: false });
      allExams = exams || [];

      const container = document.getElementById('adminExamList');
      const selectFilter = document.getElementById('examSelectFilter');

      selectFilter.innerHTML = '<option value="">Chọn bài thi để xem...</option>' + 
        allExams.map(e => `<option value="${e.id}">${e.title}</option>`).join('');

      container.innerHTML = allExams.map(exam => `
        <div class="bg-white dark:bg-zinc-900 border dark:border-zinc-800 rounded-xl p-4 shadow-sm space-y-2">
          <span class="text-[10px] font-bold text-[#cf1717] bg-red-50 dark:bg-red-950 px-2 py-0.5 rounded-full">${exam.topic}</span>
          <h3 class="font-bold text-sm text-gray-900 dark:text-white">${exam.title}</h3>
          <div class="pt-2 flex gap-2">
            <button onclick="editExam('${exam.id}')" class="w-1/2 py-1.5 bg-blue-50 text-blue-600 text-xs font-bold rounded-lg">✏️ Sửa</button>
            <button onclick="deleteExam('${exam.id}')" class="w-1/2 py-1.5 bg-red-50 text-red-600 text-xs font-bold rounded-lg">🗑️ Xóa</button>
          </div>
        </div>
      `).join('');
    }

    // JOIN LẤY THÔNG TIN HỌ TÊN VÀ NGÀY SINH TỪ BẢNG PROFILES
    async function loadResultsWithProfiles() {
      const { data: results } = await sbClient
        .from('exam_results')
        .select('*, profiles(full_name, dob)')
        .order('submitted_at', { ascending: false });
      
      allResults = results || [];
    }

    function renderScoreChartAndTable() {
      const examId = document.getElementById('examSelectFilter').value;
      const tbody = document.getElementById('adminGradebookBody');
      if (!examId) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-3 text-center text-gray-400">Vui lòng chọn bài thi ở danh sách trên.</td></tr>`;
        return;
      }

      const filtered = allResults.filter(r => r.exam_id === examId);

      // Render Bảng điểm sinh viên
      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-3 text-center text-gray-400">Chưa có sinh viên nào làm bài thi này.</td></tr>`;
      } else {
        tbody.innerHTML = filtered.map(r => `
          <tr class="hover:bg-gray-50 dark:hover:bg-zinc-800">
            <td class="p-3 font-bold text-gray-900 dark:text-white">${r.profiles?.full_name || 'N/A'}</td>
            <td class="p-3 text-gray-500">${r.profiles?.dob || 'N/A'}</td>
            <td class="p-3 font-extrabold text-[#cf1717]">${r.score} điểm</td>
            <td class="p-3 text-gray-500">${Math.floor(r.time_spent / 60)}m ${r.time_spent % 60}s</td>
            <td class="p-3 text-gray-400">${new Date(r.submitted_at).toLocaleString('vi-VN')}</td>
          </tr>
        `).join('');
      }

      // Render Biểu đồ Chart.js
      const scoreCounts = {};
      filtered.forEach(r => { scoreCounts[r.score] = (scoreCounts[r.score] || 0) + 1; });
      const labels = Object.keys(scoreCounts).sort((a,b) => a - b).map(s => `${s} Điểm`);
      const dataValues = labels.map(l => scoreCounts[parseInt(l)]);

      const ctx = document.getElementById('scoreChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{ label: 'Số học sinh', data: dataValues, backgroundColor: '#cf1717', borderRadius: 4 }]
        },
        options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
      });
    }

    function openExamModal() {
      document.getElementById('editingExamId').value = '';
      document.getElementById('examModal').classList.remove('hidden');
    }

    function closeExamModal() {
      document.getElementById('examModal').classList.add('hidden');
    }

    function editExam(id) {
      const exam = allExams.find(e => e.id === id);
      if (!exam) return;
      document.getElementById('editingExamId').value = exam.id;
      document.getElementById('examTitle').value = exam.title;
      document.getElementById('examTopic').value = exam.topic;
      document.getElementById('examTime').value = exam.time_limit;
      document.getElementById('examPassage').value = exam.passage_html;
      document.getElementById('examQuestions').value = JSON.stringify(exam.questions, null, 2);
      document.getElementById('examModal').classList.remove('hidden');
    }

    async function handleSaveExam(e) {
      e.preventDefault();
      const id = document.getElementById('editingExamId').value;
      try {
        const questionsJson = JSON.parse(document.getElementById('examQuestions').value);
        const examData = {
          title: document.getElementById('examTitle').value,
          topic: document.getElementById('examTopic').value,
          time_limit: parseInt(document.getElementById('examTime').value),
          passage_html: document.getElementById('examPassage').value,
          questions: questionsJson
        };

        if (id) {
          await sbClient.from('exams').update(examData).eq('id', id);
        } else {
          examData.token = 'ielts-' + Math.random().toString(36).substring(2, 9);
          await sbClient.from('exams').insert([examData]);
        }

        closeExamModal();
        loadAdminExams();
      } catch (err) { alert("❌ JSON câu hỏi không hợp lệ!"); }
    }

    async function deleteExam(id) {
      if (confirm("Xóa bài thi này?")) {
        await sbClient.from('exams').delete().eq('id', id);
        loadAdminExams();
      }
    }

    async function handleLogout() {
      await sbClient.auth.signOut();
      window.location.href = 'index.html';
    }

    window.onload = checkAdmin;
  </script>
</body>
</html>
