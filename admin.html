<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IELTS Master - Quản trị Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 dark:bg-zinc-950 dark:text-gray-100 min-h-screen">

  <!-- Header -->
  <header class="bg-white dark:bg-zinc-900 border-b dark:border-zinc-800 px-6 py-4 flex justify-between items-center sticky top-0 z-40">
    <div class="flex items-center gap-3">
      <img src="https://ibb.co/Zz0KkyYf" alt="Logo" class="h-9">
      <span class="font-extrabold text-xl text-[#cf1717]">ADMIN DASHBOARD</span>
    </div>
    <div class="flex items-center gap-4">
      <button onclick="openModal('createExamModal')" class="flex items-center gap-2 bg-[#cf1717] hover:bg-red-700 text-white font-bold px-4 py-2 rounded-lg text-sm shadow transition">
        <span class="text-lg font-black">+</span> Tạo bài reading mới
      </button>
      <button onclick="document.documentElement.classList.toggle('dark')" class="p-2 rounded-full bg-gray-100 dark:bg-zinc-800">🌙</button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-6 space-y-8">
    
    <!-- Danh sách bài đọc Reading -->
    <section>
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-gray-800 dark:text-white">Danh Sách Bài Thi Reading</h2>
      </div>
      <div id="examList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- JS render dữ liệu ở đây -->
      </div>
    </section>

    <!-- Quản lý Tin tức / Thông báo -->
    <section class="bg-white dark:bg-zinc-900 p-6 rounded-2xl border dark:border-zinc-800 shadow-sm">
      <h2 class="text-xl font-bold mb-4 text-[#cf1717]">Đăng Tin Tức / Thông Báo Mới</h2>
      <form onsubmit="handleCreateNews(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase mb-1">Tiêu đề tin tức</label>
          <input type="text" id="newsTitle" required class="w-full p-2.5 rounded-lg border dark:bg-zinc-800 dark:border-zinc-700">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase mb-1">Link Ảnh (ImgBB)</label>
          <input type="url" id="newsImg" placeholder="https://i.ibb.co/..." class="w-full p-2.5 rounded-lg border dark:bg-zinc-800 dark:border-zinc-700">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase mb-1">Nội dung</label>
          <textarea id="newsContent" rows="3" required class="w-full p-2.5 rounded-lg border dark:bg-zinc-800 dark:border-zinc-700"></textarea>
        </div>
        <button type="submit" class="bg-zinc-800 hover:bg-black text-white dark:bg-zinc-700 font-bold px-5 py-2.5 rounded-lg text-sm transition">
          Đăng Thông Báo
        </button>
      </form>
    </section>

  </main>

  <!-- MODAL TẠO BÀI THI MỚI -->
  <div id="createExamModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50 overflow-y-auto">
    <div class="bg-white dark:bg-zinc-900 border dark:border-zinc-800 rounded-2xl p-6 w-full max-w-2xl my-8 shadow-2xl">
      <h3 class="text-2xl font-extrabold text-[#cf1717] mb-4">Tạo Bài Reading Mới</h3>
      
      <form onsubmit="handleCreateExam(event)" class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase mb-1">Tên Bài Thi</label>
            <input type="text" id="examTitleInput" required placeholder="IELTS Reading Test 1" class="w-full p-2.5 rounded-lg border dark:bg-zinc-800 dark:border-zinc-700">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase mb-1">Chủ đề (Topic)</label>
            <input type="text" id="examTopic" required placeholder="Environment, Science..." class="w-full p-2.5 rounded-lg border dark:bg-zinc-800 dark:border-zinc-700">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase mb-1">Thời gian (Phút)</label>
            <input type="number" id="examTime" value="60" required class="w-full p-2.5 rounded-lg border dark:bg-zinc-800 dark:border-zinc-700">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase mb-1">Ghi chú (Notes)</label>
            <input type="text" id="examNotes" placeholder="Dành cho lớp Chuyên Anh..." class="w-full p-2.5 rounded-lg border dark:bg-zinc-800 dark:border-zinc-700">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase mb-1">Nội dung bài đọc (HTML/Text - Có thể dán thẻ <img> link ImgBB)</label>
          <textarea id="examPassage" rows="6" required placeholder="<p>Passage content...</p><img src='https://i.ibb.co/...'/>" class="w-full p-2.5 rounded-lg border dark:bg-zinc-800 dark:border-zinc-700 font-mono text-sm"></textarea>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase mb-1">Danh sách câu hỏi & Đáp án (JSON Format)</label>
          <textarea id="examQuestions" rows="5" required placeholder='[{"id":1, "question": "Question text...", "options": ["A", "B", "C", "D"], "answer": "A"}]' class="w-full p-2.5 rounded-lg border dark:bg-zinc-800 dark:border-zinc-700 font-mono text-xs"></textarea>
        </div>

        <div class="flex gap-3 pt-4">
          <button type="button" onclick="closeModal('createExamModal')" class="w-1/2 py-3 bg-gray-200 dark:bg-zinc-800 font-bold rounded-lg">Hủy</button>
          <button type="submit" class="w-1/2 py-3 bg-[#cf1717] hover:bg-red-700 text-white font-bold rounded-lg transition">Tạo & Phát Hành Token Link</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    // Tạo mã Token ngẫu nhiên cho link bài thi
    function generateToken() {
      return 'ielts-' + Math.random().toString(36).substring(2, 9);
    }

    // Xử lý tạo bài thi
    async function handleCreateExam(e) {
      e.preventDefault();
      const token = generateToken();
      
      const newExam = {
        title: document.getElementById('examTitleInput').value,
        topic: document.getElementById('examTopic').value,
        time_limit: parseInt(document.getElementById('examTime').value),
        notes: document.getElementById('examNotes').value,
        passage_html: document.getElementById('examPassage').value,
        questions: JSON.parse(document.getElementById('examQuestions').value),
        token: token
      };

      const { error } = await supabase.from('exams').insert([newExam]);

      if (error) {
        alert("Lỗi khi tạo bài thi: " + error.message);
      } else {
        alert("Tạo bài thi thành công!\nLink Token: exam.html?token=" + token);
        closeModal('createExamModal');
        fetchExams();
      }
    }

    // Đăng tin tức
    async function handleCreateNews(e) {
      e.preventDefault();
      const newsData = {
        title: document.getElementById('newsTitle').value,
        image_url: document.getElementById('newsImg').value,
        content: document.getElementById('newsContent').value
      };

      const { error } = await supabase.from('news').insert([newsData]);
      if (error) alert("Lỗi: " + error.message);
      else { alert("Đăng tin tức thành công!"); e.target.reset(); }
    }

    // Tải danh sách bài thi
    async function fetchExams() {
      const { data: exams, error } = await supabase.from('exams').select('*').order('created_at', { ascending: false });
      const container = document.getElementById('examList');
      if (error || !exams) return;

      container.innerHTML = exams.map(exam => `
        <div class="bg-white dark:bg-zinc-900 border dark:border-zinc-800 rounded-xl p-5 shadow-sm space-y-3">
          <div class="flex justify-between items-start">
            <span class="text-xs font-bold px-2.5 py-1 bg-red-100 dark:bg-red-950 text-[#cf1717] rounded-full">${exam.topic}</span>
            <span class="text-xs text-gray-400">${new Date(exam.created_at).toLocaleDateString('vi-VN')}</span>
          </div>
          <h3 class="font-bold text-lg text-gray-800 dark:text-white">${exam.title}</h3>
          <p class="text-xs text-gray-500 line-clamp-2">${exam.notes || 'Không có ghi chú'}</p>
          <div class="pt-2 flex flex-col gap-2">
            <button onclick="navigator.clipboard.writeText(window.location.origin + '/exam.html?token=${exam.token}'); alert('Đã sao chép Link Token bài thi!');" class="w-full py-2 bg-gray-100 dark:bg-zinc-800 hover:bg-gray-200 text-xs font-bold rounded">
              🔗 Sao chép Link Token
            </button>
          </div>
        </div>
      `).join('');
    }

    window.onload = fetchExams;
  </script>
</body>
</html>
