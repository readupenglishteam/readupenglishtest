<style>
  @keyframes blob {
    0%, 100% { transform: translate(0px, 0px) scale(1); }
    33% { transform: translate(30px, -50px) scale(1.1); }
    66% { transform: translate(-20px, 20px) scale(0.95); }
  }
  .animate-blob { animation: blob 10s infinite ease-in-out; }
  .animation-delay-2000 { animation-delay: 2s; }
  .animation-delay-4000 { animation-delay: 4s; }
  @keyframes slideDown {
    0% { opacity: 0; transform: translateY(-40px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .animate-slide-down { animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  /* Tuỳ chỉnh chiều rộng ô nhập SĐT cho khớp với Tailwind */
  .iti { width: 100%; }
  .dark .iti__country-list { background-color: #27272a; color: #fff; }

  /* ===== BÉ MÈO NẰM TRÊN THẺ ĐĂNG NHẬP ===== */
  .ru-card { position: relative; --cw: 170px; margin-top: calc(var(--cw) * 0.655 + 18px); }
  @media (max-width: 480px) { .ru-card { --cw: 140px; } }
  .ru-lie { position: absolute; z-index: 3; bottom: calc(100% - 28px); left: 50%; margin-left: calc(var(--cw) / -2); width: var(--cw);
    cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .ru-lie svg { display: block; width: 100%; height: auto; overflow: visible; transform-origin: 50% 100%;
    filter: drop-shadow(0 6px 8px rgba(0,0,0,.14)); animation: ruBreathe 4s ease-in-out infinite; }
  @keyframes ruBreathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.012,1.04); } }
  .ru-eyeopen { transform-box: fill-box; transform-origin: 50% 50%; transform: scaleY(0); animation: ruEyeOpen 5.5s infinite; }
  .ru-arc { animation: ruEyeArc 5.5s infinite; }
  @keyframes ruEyeOpen { 0%,66%,100% { transform: scaleY(0); } 70%,78% { transform: scaleY(1); } 81% { transform: scaleY(.08); } 84%,91% { transform: scaleY(1); } 95% { transform: scaleY(0); } }
  @keyframes ruEyeArc { 0%,66%,100% { opacity: 1; } 69%,94% { opacity: 0; } }
  /* Zzz */
  .ru-z { position: absolute; top: -2px; font-weight: 800; font-size: 14px; color: #cf1717; opacity: 0; pointer-events: none; animation: ruZ 3.2s ease-in-out infinite; }
  .ru-z2 { font-size: 18px; animation-delay: 1.4s; }
  @keyframes ruZ { 0% { opacity: 0; transform: translate(0,10px) scale(.7); } 30% { opacity: .85; } 100% { opacity: 0; transform: translate(10px,-22px) scale(1.15); } }
  /* Phản ứng khi báo lỗi / thành công / vuốt ve */
  .ru-lie.ru-alert .ru-eyeopen, .ru-lie.ru-ok .ru-eyeopen, .ru-lie.ru-pet .ru-eyeopen { animation: none; transform: scaleY(1); }
  .ru-lie.ru-alert .ru-arc, .ru-lie.ru-ok .ru-arc, .ru-lie.ru-pet .ru-arc { animation: none; opacity: 0; }
  .ru-lie.ru-alert .ru-z, .ru-lie.ru-ok .ru-z, .ru-lie.ru-pet .ru-z { display: none; }
  .ru-lie.ru-alert svg { animation: ruShake .6s ease both; }
  .ru-lie.ru-ok svg { animation: ruJoy .75s ease both; }
  .ru-lie.ru-pet svg { animation: ruJoy .6s ease both; }
  @keyframes ruShake { 0%,100% { transform: translateX(0); } 15% { transform: translateX(-9px) rotate(-3deg); } 35% { transform: translateX(8px) rotate(3deg); }
    55% { transform: translateX(-6px) rotate(-2deg); } 75% { transform: translateX(4px); } }
  @keyframes ruJoy { 0%,100% { transform: translateY(0) scale(1,1); } 25% { transform: translateY(-16px) scale(.97,1.05); }
    50% { transform: translateY(0) scale(1.04,.95); } 70% { transform: translateY(-8px); } }
  /* Bong bóng thông báo của mèo */
  .ru-say { position: absolute; left: 50%; bottom: calc(100% + 8px); z-index: 4; width: max-content; max-width: min(300px, 86vw); text-align: center;
    font-size: 13px; font-weight: 700; line-height: 1.35; padding: 8px 14px; border-radius: 14px; border: 1px solid transparent;
    background: #fff; color: #cf1717; box-shadow: 0 8px 22px rgba(0,0,0,.16); pointer-events: none;
    opacity: 0; transform: translateX(-50%) translateY(8px) scale(.85); transform-origin: 50% 100%;
    transition: opacity .25s ease, transform .4s cubic-bezier(.34,1.56,.64,1); }
  .ru-say::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 12px; height: 12px; background: inherit; border-radius: 3px;
    transform: translateX(-50%) rotate(45deg); border-right: 1px solid transparent; border-bottom: 1px solid transparent; border-color: inherit; }
  .ru-say.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  .ru-say.err { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
  .ru-say.ok { background: #f0fdf4; color: #15803d; border-color: #bbf7d0; }
  .dark .ru-say.err { background: #3b1414; color: #fca5a5; border-color: #7f1d1d; }
  .dark .ru-say.ok { background: #0f2a1a; color: #86efac; border-color: #14532d; }
  .dark .ru-say.pet { background: #27272a; color: #fca5a5; }
  @media (prefers-reduced-motion: reduce) { .ru-lie svg, .ru-eyeopen, .ru-arc, .ru-z { animation: none !important; } }
</style>

<script>
  const SUPABASE_URL = "https://klovtvjfvfenhkvifujy.supabase.co";
  const SUPABASE_KEY = "sb_publishable_WevQJCkdgfwbgnUoNu1SfA_Ec9hT49-";
  const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentMode = 'login';

  // Trang muốn quay lại sau khi đăng nhập (chỉ cho phép file .html cùng thư mục, tránh chuyển hướng ra ngoài)
  const nextParam = new URLSearchParams(location.search).get('next');
  const nextUrl = (nextParam && /^[\w\-]+\.html(\?[^#\s]*)?$/.test(nextParam)) ? nextParam : null;

  // Lối tắt Assignment: chưa đăng nhập thì báo rõ, không âm thầm bị bật ngược về đây
  document.getElementById('vipShortcut')?.addEventListener('click', async (e) => {
    e.preventDefault();
    const { data: { session } } = await sbClient.auth.getSession();
    if (session) { window.location.href = 'assignment.html'; return; }
    const msg = document.getElementById('authMsg');
    msg.innerHTML = '<i class="bi bi-exclamation-triangle-fill"></i> Bạn chưa đăng nhập. Hãy đăng nhập bằng tài khoản VIP ở trên, hệ thống sẽ tự chuyển vào trang Assignment.';
    msg.className = 'mt-4 text-center text-sm font-semibold text-amber-600';
    window.__goAssignmentAfterLogin = true;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  function switchTab(mode) {
  currentMode = mode;
  const isReg = currentMode === 'register';

  document.getElementById('fullNameGroup')?.classList.toggle('hidden', !isReg);
  document.getElementById('dobGroup')?.classList.toggle('hidden', !isReg);
  document.getElementById('phoneGroup')?.classList.toggle('hidden', !isReg); // 👈 Sửa !isRegister thành !isReg ở đây

  document.getElementById('tabLogin').className = isReg

    : 'w-1/2 py-2.5 text-center font-bold text-[#cf1717] border-b-2 border-[#cf1717] transition';
  
  document.getElementById('tabRegister').className = isReg 
    ? 'w-1/2 py-2.5 text-center font-bold text-[#cf1717] border-b-2 border-[#cf1717] transition' 
    : 'w-1/2 py-2.5 text-center font-bold text-gray-400 hover:text-gray-600 transition';
}

// 3. Hàm Xử lý Đăng ký / Đăng nhập
async function handleAuth(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const fullName = document.getElementById('fullName')?.value?.trim() || '';
  
  // Lấy SĐT đầy đủ có mã quốc gia (VD: +84912345678)
  const phone = phoneInputIti ? phoneInputIti.getNumber() : document.getElementById('phone')?.value?.trim();
  
  // Flatpickr tự động chuyển giá trị #dob thành YYYY-MM-DD chuẩn Supabase
  const isoDob = document.getElementById('dob')?.value?.trim() || ''; 
  const msg = document.getElementById('authMsg');

  msg.innerHTML = '<i class="bi bi-hourglass-split"></i> Đang xử lý...';
  msg.className = "mt-4 text-center text-sm font-semibold text-gray-500";

  if (currentMode === 'register') {
    if (!fullName || !isoDob) {
      msg.innerHTML = '<i class="bi bi-exclamation-triangle-fill"></i> Vui lòng nhập đầy đủ Họ tên và Chọn ngày sinh!';
      msg.className = "mt-4 text-center text-sm font-semibold text-red-500";
      return;
    }
    if (!phone) {
      msg.innerHTML = '<i class="bi bi-exclamation-triangle-fill"></i> Vui lòng nhập đầy đủ Số điện thoại!';
      msg.className = "mt-4 text-center text-sm font-semibold text-red-500";
      return;
    }

    const { data, error } = await sbClient.auth.signUp({
      email,
      password,
      options: {
        data: { 
          full_name: fullName, 
          phone: phone, 
          dob: isoDob, 
          role: 'student' 
        }
      }
    });

    if (error) {
      msg.innerHTML = '<i class="bi bi-dash-circle-fill"></i> Lỗi đăng ký: ' + error.message;
      msg.className = "mt-4 text-center text-sm font-semibold text-red-500";
    } else {
      msg.innerHTML = '<i class="bi bi-check-circle"></i> Đăng ký thành công!';
      msg.className = "mt-4 text-center text-sm font-semibold text-green-600";
      setTimeout(() => window.location.href = 'dashboard.html', 1500);
    }
  } else {
    // Luồng Đăng nhập
    const { data: authData, error: authError } = await sbClient.auth.signInWithPassword({ email, password });
    
    if (authError) {
      msg.innerHTML = '<i class="bi bi-x-circle-fill"></i> Đăng nhập thất bại: ';
      msg.appendChild(document.createTextNode(authError.message));
      msg.className = "mt-4 text-center text-sm font-semibold text-red-500";
      return;
    }

    const { data: profile } = await sbClient
      .from('profiles')
      .select('role')
      .eq('id', authData.user.id)
      .single();

    const role = profile?.role?.trim().toLowerCase();

    if (role === 'admin') {
  msg.innerHTML = '<i class="bi bi-gear"></i> Đăng nhập Admin thành công';
  msg.className = "mt-4 text-center text-sm font-semibold text-green-600";
  setTimeout(() => window.location.href = 'admin.html', 1000);
} else if (role === 'teacher' || role === 'assistant') {
  msg.innerHTML = '<i class="bi bi-person-badge"></i> Đăng nhập Giảng viên thành công';
  msg.className = "mt-4 text-center text-sm font-semibold text-green-600";
  setTimeout(() => window.location.href = 'teacher.html', 1000);
} else {
  msg.innerHTML = '<i class="bi bi-check-circle"></i> Đăng nhập thành công';
  msg.className = "mt-4 text-center text-sm font-semibold text-green-600";
  setTimeout(() => window.location.href = nextUrl || (window.__goAssignmentAfterLogin ? 'assignment.html' : 'dashboard.html'), 1000);
}
  }
}

  // 1. ĐĂNG NHẬP BẰNG GOOGLE
  async function loginWithGoogle() {
    const msg = document.getElementById('authMsg');
    const redirectUrl = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '/dashboard.html');
    const { data, error } = await sbClient.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: redirectUrl }
    });
    if (error) {
      msg.innerHTML = `<i class="bi bi-dash-circle-fill"></i> Lỗi đăng nhập Google: ${error.message}`;
      msg.className = "mt-4 text-center text-sm font-semibold text-red-500";
    }
  }

  // 2. ĐĂNG NHẬP BẰNG FACEBOOK / GITHUB / APPLE
  async function loginWithSocial(providerName) {
    const msg = document.getElementById('authMsg');
    const redirectUrl = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '/dashboard.html');
    const { data, error } = await sbClient.auth.signInWithOAuth({
      provider: providerName,
      options: { redirectTo: redirectUrl }
    });
    if (error) {
      msg.innerHTML = `<i class="bi bi-dash-circle-fill"></i> Lỗi đăng nhập ${providerName}: ${error.message}`;
      msg.className = "mt-4 text-center text-sm font-semibold text-red-500";
    }
  }

  // 3. ĐĂNG NHẬP BẰNG EMAIL & MẬT KHẨU TRUYỀN THỐNG
  async function loginWithEmail(email, password) {
    const msg = document.getElementById('authMsg');
    const { data, error } = await sbClient.auth.signInWithPassword({
      email: email,
      password: password
    });
    if (error) {
      msg.innerHTML = '<i class="bi bi-dash-circle-fill"></i> Sai email hoặc mật khẩu!';
      msg.className = "mt-4 text-center text-sm font-semibold text-red-500";
    } else {
      window.location.href = 'dashboard.html';
    }
  }

  // 4. ĐĂNG NHẬP KHÔNG CẦN MẬT KHẨU (MAGIC LINK)
  async function loginWithMagicLink(email) {
    const msg = document.getElementById('authMsg');
    const { data, error } = await sbClient.auth.signInWithOtp({
      email: email,
      options: {
        emailRedirectTo: window.location.origin + '/dashboard.html'
      }
    });
    if (error) {
      msg.innerHTML = `<i class="bi bi-dash-circle-fill"></i> Lỗi gửi liên kết: ${error.message}`;
      msg.className = "mt-4 text-center text-sm font-semibold text-red-500";
    } else {
      alert("Đã gửi link đăng nhập vào Email của bạn!");
    }
  }

  function toggleDarkMode() {
    if (document.documentElement.classList.contains('dark')) {
      document.documentElement.classList.remove('dark');
      localStorage.theme = 'light';
    } else {
      document.documentElement.classList.add('dark');
      localStorage.theme = 'dark';
    }
  }

  function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('i');

    if (input.type === 'password') {
      input.type = 'text';
      icon.className = 'bi bi-eye-slash text-lg leading-none';
    } else {
      input.type = 'password';
      icon.className = 'bi bi-eye text-lg leading-none';
    }
  }
  function formatToISO(vnDateStr) {
  if (!vnDateStr) return null;
  const parts = vnDateStr.trim().split('/');
  if (parts.length === 3) {
    const day = parts[0].padStart(2, '0');
    const month = parts[1].padStart(2, '0');
    const year = parts[2];
    
    // Kiểm tra tính hợp lệ cơ bản của ngày, tháng, năm
    if (Number(day) > 0 && Number(day) <= 31 && Number(month) > 0 && Number(month) <= 12 && year.length === 4) {
      return `${year}-${month}-${day}`;
    }
  }
  return null;
}
  let phoneInputIti;
document.addEventListener("DOMContentLoaded", () => {
  const phoneInputField = document.getElementById("phone");
  if (phoneInputField) {
    phoneInputIti = window.intlTelInput(phoneInputField, {
      initialCountry: "vn",
      separateDialCode: true,
      utilsScript: "https://cdn.jsdelivr.net/npm/intl-tel-input@18.2.1/build/js/utils.js",
    });
  }

  // 2. Khởi tạo Bảng chọn Lịch ngày sinh (Định dạng hiển thị dd/mm/yyyy)
  flatpickr("#dob", {
    locale: "vn",
    altInput: true,
    altFormat: "d/m/Y",   // Hiển thị cho người dùng xem: DD/MM/YYYY
    dateFormat: "Y-m-d",   // Giá trị thực tế lấy gửi Supabase: YYYY-MM-DD
    disableMobile: true,
    allowInput: true,
    maxDate: "today"
  });
});
</script>

<script>
/* Bé mèo báo kết quả đăng nhập / đăng ký (đọc thông báo ở #authMsg, không đụng vào logic cũ) */
(function(){
  var wrap=document.getElementById('ruLie'), say=document.getElementById('ruSay'),
      msg=document.getElementById('authMsg'), form=document.getElementById('authForm');
  if(!wrap||!say||!msg)return;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){
    wrap.querySelectorAll('animateTransform').forEach(function(n){n.remove();});
  }
  var t=null, last='';
  function speak(state,text,ms){
    wrap.classList.remove('ru-alert','ru-ok','ru-pet'); void wrap.offsetWidth;
    wrap.classList.add(state==='ok'?'ru-ok':state==='err'?'ru-alert':'ru-pet');
    say.textContent=text; say.className='ru-say show '+(state==='pet'?'pet':state);
    clearTimeout(t); t=setTimeout(rest,ms||4500);
  }
  function rest(){ wrap.classList.remove('ru-alert','ru-ok','ru-pet'); say.classList.remove('show'); }
  function react(){
    var cls=msg.className||'', txt=(msg.textContent||'').trim();
    if(!txt||/Đang xử lý/.test(txt)){last='';return;}
    var key=cls+'|'+txt; if(key===last)return; last=key;
    if(/text-red-/.test(cls)){
      if(/Vui lòng nhập/.test(txt)) speak('err','Bạn điền thiếu thông tin rồi nè 📝');
      else if(/Email not confirmed/i.test(txt)) speak('err','Email chưa được xác nhận 📧 Kiểm tra hộp thư nhé!');
      else if(/Đăng nhập thất bại|Sai email|Invalid login/i.test(txt)) speak('err','Ối! Sai email hoặc mật khẩu rồi 😿 Thử lại nhé!');
      else if(/đăng ký/i.test(txt)) speak('err','Đăng ký chưa được 😿 Xem thông báo bên dưới nhé!');
      else speak('err','Có lỗi rồi 😿 Xem thông báo bên dưới nhé!');
    } else if(/text-green-/.test(cls)){
      if(/Admin/.test(txt)) speak('ok','Chào Admin! Đăng nhập thành công 🎉',3800);
      else if(/Giảng viên/.test(txt)) speak('ok','Chào thầy/cô! Đăng nhập thành công 🎉',3800);
      else if(/Đăng ký thành công/i.test(txt)) speak('ok','Đăng ký thành công! Chào mừng bạn 🎉',4500);
      else speak('ok','Đăng nhập thành công! Chào mừng bạn trở lại 🎉',3800);
    }
  }
  new MutationObserver(react).observe(msg,{childList:true,characterData:true,subtree:true,attributes:true,attributeFilter:['class']});
  if(form)form.addEventListener('submit',function(){last='';},true);
  wrap.addEventListener('click',function(){ speak('pet',['Meo~ 😽','Gừ gừ… 💤','Đăng nhập rồi mình chơi nhé! 🐾'][Math.floor(Math.random()*3)],2200); });
})();
</script>
