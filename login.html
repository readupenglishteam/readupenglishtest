<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadUp English - Đăng nhập / Đăng ký</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Thêm Bootstrap Icons CDN để hiển thị các icon trong thông báo -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="icon" type="image/png" href="https://i.ibb.co/wrPLDMMH/Xanh-Tr-ng-n-Gi-n-Bi-u-T-ng-Logo.png">
</head>
<body class="bg-gradient-to-br from-red-50 via-white to-gray-100 dark:bg-zinc-950 dark:text-white min-h-screen transition-colors duration-300">

<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none select-none transition-colors duration-500 bg-slate-50 dark:bg-zinc-950">
  <div class="absolute -top-24 -left-24 w-96 h-96 bg-[#cf1717]/20 dark:bg-[#cf1717]/15 rounded-full blur-3xl animate-blob"></div>
  <div class="absolute top-1/3 -right-24 w-[30rem] h-[30rem] bg-indigo-500/15 dark:bg-red-900/10 rounded-full blur-3xl animate-blob animation-delay-2000"></div>
  <div class="absolute -bottom-24 left-1/3 w-96 h-96 bg-amber-500/15 dark:bg-amber-600/10 rounded-full blur-3xl animate-blob animation-delay-4000"></div>
</div>

<style>
  @keyframes blob {
    0%, 100% { transform: translate(0px, 0px) scale(1); }
    33% { transform: translate(30px, -50px) scale(1.1); }
    66% { transform: translate(-20px, 20px) scale(0.95); }
  }
  .animate-blob { animation: blob 10s infinite ease-in-out; }
  .animation-delay-2000 { animation-delay: 2s; }
  .animation-delay-4000 { animation-delay: 4s; }
  @keyframes slideDown {
    0% { opacity: 0; transform: translateY(-40px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .animate-slide-down { animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
</style> 

<header class="sticky top-0 z-40 backdrop-blur-md border-b border-gray-200/60 dark:border-zinc-800/60 bg-white/60 dark:bg-zinc-950/60 transition px-4">
  <div class="max-w-7xl mx-auto h-16 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <a href="index.html" class="w-12 h-12 rounded-full bg-[#cf1717] flex items-center justify-center overflow-hidden flex-shrink-0 shadow-md hover:scale-105 transition">
        <img src="https://i.ibb.co/9m1LMnz3/Xanh-Tr-ng-n-Gi-n-Bi-u-T-ng-Logo-1.png" alt="ReadUp Logo" class="h-9 w-auto object-contain">
      </a>
      <a href="index.html" class="flex items-center gap-2 hover:opacity-90 transition">
        <span class="text-2xl font-black text-[#cf1717] tracking-tight">ReadUp</span>
        <span class="text-xs font-bold text-white bg-[#cf1717] px-2 py-0.5 rounded-full shadow-sm">English</span>
      </a>
    </div>

    <div class="flex items-center gap-2 sm:gap-3">
      <a href="index.html" class="px-3 py-2 text-xs font-bold bg-gray-100/80 dark:bg-zinc-800/80 hover:bg-gray-200 dark:hover:bg-zinc-700 text-gray-700 dark:text-gray-300 rounded-xl transition border border-gray-200/50 dark:border-zinc-700/50 flex items-center gap-1">
        <span>🏠</span>
        <span class="hidden sm:inline">Trang chủ</span>
      </a>
      <button type="button" onclick="toggleDarkMode()" class="p-2 rounded-xl bg-gray-100/80 dark:bg-zinc-800/80 hover:bg-gray-200 dark:hover:bg-zinc-700 transition text-sm border border-gray-200/50 dark:border-zinc-700/50">
        <span id="themeIcon">🌙</span>
      </button>
    </div>
  </div>
</header>

<main class="flex justify-center items-center py-8 px-4 animate-slide-down">
  <div class="w-full max-w-md bg-white dark:bg-zinc-900 rounded-2xl shadow-xl p-8 border border-gray-100 dark:border-zinc-800">
    
    <div class="flex border-b border-gray-200 dark:border-zinc-700 mb-6">
      <button id="tabLogin" type="button" onclick="switchTab('login')" class="w-1/2 py-2.5 text-center font-bold text-[#cf1717] border-b-2 border-[#cf1717] transition">
        Đăng Nhập
      </button>
      <button id="tabRegister" type="button" onclick="switchTab('register')" class="w-1/2 py-2.5 text-center font-bold text-gray-400 hover:text-gray-600 transition">
        Đăng Ký
      </button>
    </div>

    <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
      <div id="fullNameGroup" class="hidden">
        <label class="block text-xs font-bold uppercase mb-1 text-gray-600 dark:text-gray-300">Họ và Tên</label>
        <input type="text" id="fullName" placeholder="Nguyễn Văn A" class="w-full p-3 rounded-lg border border-gray-300 dark:border-zinc-700 dark:bg-zinc-800 focus:outline-none focus:ring-2 focus:ring-[#cf1717]">
      </div>

      <div id="dobGroup" class="hidden">
        <label class="block text-xs font-bold uppercase mb-1 text-gray-600 dark:text-gray-300">Ngày tháng năm sinh</label>
        <input type="date" id="dob" class="w-full p-3 rounded-lg border border-gray-300 dark:border-zinc-700 dark:bg-zinc-800 focus:outline-none focus:ring-2 focus:ring-[#cf1717]">
      </div>

      <div>
        <label class="block text-xs font-bold uppercase mb-1 text-gray-600 dark:text-gray-300">Email</label>
        <input type="email" id="email" required placeholder="student@example.com" class="w-full p-3 rounded-lg border border-gray-300 dark:border-zinc-700 dark:bg-zinc-800 focus:outline-none focus:ring-2 focus:ring-[#cf1717]">
      </div>

      <div>
        <label class="block text-xs font-bold uppercase mb-1 text-gray-600 dark:text-gray-300">Mật khẩu</label>
        <div class="relative w-full">
          <input type="password" id="password" required placeholder="••••••••" class="w-full p-3 pr-10 rounded-lg border border-gray-300 dark:border-zinc-700 dark:bg-zinc-800 focus:outline-none focus:ring-2 focus:ring-[#cf1717]">
          <button type="button" onclick="togglePasswordVisibility('password', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 focus:outline-none p-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="w-full py-3 bg-[#cf1717] hover:bg-red-700 text-white font-bold rounded-lg transition shadow-md hover:shadow-lg">
        Đăng Nhập
      </button>

      <!-- Đã thêm type="button" cho các nút Đăng nhập mạng xã hội -->
      <button type="button" onclick="loginWithGoogle()" class="w-full flex items-center justify-center gap-3 py-2.5 bg-white dark:bg-zinc-800 border border-gray-300 dark:border-zinc-700 rounded-xl font-bold text-xs hover:bg-gray-50 transition shadow-sm">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-4 h-4" alt="Google">
        Đăng nhập bằng Google
      </button>

      <button type="button" onclick="loginWithSocial('facebook')" class="w-full flex items-center justify-center gap-3 py-2.5 bg-[#1877F2] text-white rounded-xl font-bold text-xs hover:opacity-90 transition shadow-sm">
        <img src="https://www.svgrepo.com/show/475647/facebook-color.svg" class="w-4 h-4 bg-white rounded-full" alt="Facebook">
        Đăng nhập bằng Facebook
      </button>

      <div class="pt-2 text-center">
        <span class="text-xs text-gray-400 dark:text-gray-500 flex items-center justify-center gap-1 font-medium">
          Dữ liệu đã được bảo mật
        </span>
      </div>
    </form>

    <p id="authMsg" class="mt-4 text-center text-sm font-semibold break-words"></p>
  </div>
</main>

<script>
  const SUPABASE_URL = "https://klovtvjfvfenhkvifujy.supabase.co";
  const SUPABASE_KEY = "sb_publishable_WevQJCkdgfwbgnUoNu1SfA_Ec9hT49-";
  const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentMode = 'login';

  function switchTab(mode) {
    currentMode = mode;
    const isReg = currentMode === 'register';

    document.getElementById('fullNameGroup').classList.toggle('hidden', !isReg);
    document.getElementById('dobGroup').classList.toggle('hidden', !isReg);
    document.getElementById('submitBtn').innerText = isReg ? 'Tạo Tài Khoản Đăng Ký' : 'Đăng Nhập';

    document.getElementById('tabLogin').className = isReg 
      ? 'w-1/2 py-2.5 text-center font-bold text-gray-400 hover:text-gray-600 transition' 
      : 'w-1/2 py-2.5 text-center font-bold text-[#cf1717] border-b-2 border-[#cf1717] transition';
    
    document.getElementById('tabRegister').className = isReg 
      ? 'w-1/2 py-2.5 text-center font-bold text-[#cf1717] border-b-2 border-[#cf1717] transition' 
      : 'w-1/2 py-2.5 text-center font-bold text-gray-400 hover:text-gray-600 transition';
  }

  async function handleAuth(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const fullName = document.getElementById('fullName').value.trim();
    const dob = document.getElementById('dob').value;
    const msg = document.getElementById('authMsg');

    msg.innerText = "⏳ Đang xử lý...";
    msg.className = "mt-4 text-center text-sm font-semibold text-gray-500";

    if (currentMode === 'register') {
      if (!fullName || !dob) {
        msg.innerText = "⚠️ Vui lòng nhập đầy đủ Họ tên và Ngày sinh!";
        msg.className = "mt-4 text-center text-sm font-semibold text-red-500";
        return;
      }

      const { data, error } = await sbClient.auth.signUp({
        email,
        password,
        options: {
          data: { full_name: fullName, dob: dob, role: 'student' }
        }
      });

      if (error) {
        msg.innerHTML = '<i class="bi bi-dash-circle-fill"></i> Lỗi đăng ký: ' + error.message;
        msg.className = "mt-4 text-center text-sm font-semibold text-red-500";
      } else {
        msg.innerHTML = '<i class="bi bi-check-circle"></i> Đăng ký thành công!';
        msg.className = "mt-4 text-center text-sm font-semibold text-green-600";
        setTimeout(() => window.location.href = 'dashboard.html', 1500);
      }
    } else {
      const { data: authData, error: authError } = await sbClient.auth.signInWithPassword({ email, password });
      
      if (authError) {
        msg.innerText = "❌ Đăng nhập thất bại: " + authError.message;
        msg.className = "mt-4 text-center text-sm font-semibold text-red-500";
        return;
      }

      const { data: profile } = await sbClient
        .from('profiles')
        .select('role')
        .eq('id', authData.user.id)
        .single();

      const role = profile?.role?.trim().toLowerCase();

      if (role === 'admin') {
        msg.innerHTML = '<i class="bi bi-gear"></i> Đăng nhập Admin thành công';
        msg.className = "mt-4 text-center text-sm font-semibold text-green-600";
        setTimeout(() => window.location.href = 'admin.html', 1000);
      } else {
        msg.innerHTML = '<i class="bi bi-check-circle"></i> Đăng nhập thành công';
        msg.className = "mt-4 text-center text-sm font-semibold text-green-600";
        setTimeout(() => window.location.href = 'dashboard.html', 1000);
      }
    }
  }

  // 1. ĐĂNG NHẬP BẰNG GOOGLE
  async function loginWithGoogle() {
    const msg = document.getElementById('authMsg');
    const redirectUrl = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '/dashboard.html');
    const { data, error } = await sbClient.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: redirectUrl }
    });
    if (error) {
      msg.innerHTML = `<i class="bi bi-dash-circle-fill"></i> Lỗi đăng nhập Google: ${error.message}`;
      msg.className = "mt-4 text-center text-sm font-semibold text-red-500";
    }
  }

  // 2. ĐĂNG NHẬP BẰNG FACEBOOK / GITHUB / APPLE
  async function loginWithSocial(providerName) {
    const msg = document.getElementById('authMsg');
    const redirectUrl = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '/dashboard.html');
    const { data, error } = await sbClient.auth.signInWithOAuth({
      provider: providerName,
      options: { redirectTo: redirectUrl }
    });
    if (error) {
      msg.innerHTML = `<i class="bi bi-dash-circle-fill"></i> Lỗi đăng nhập ${providerName}: ${error.message}`;
      msg.className = "mt-4 text-center text-sm font-semibold text-red-500";
    }
  }

  // 3. ĐĂNG NHẬP BẰNG EMAIL & MẬT KHẨU TRUYỀN THỐNG
  async function loginWithEmail(email, password) {
    const msg = document.getElementById('authMsg');
    const { data, error } = await sbClient.auth.signInWithPassword({
      email: email,
      password: password
    });
    if (error) {
      msg.innerHTML = '<i class="bi bi-dash-circle-fill"></i> Sai email hoặc mật khẩu!';
      msg.className = "mt-4 text-center text-sm font-semibold text-red-500";
    } else {
      window.location.href = 'dashboard.html';
    }
  }

  // 4. ĐĂNG NHẬP KHÔNG CẦN MẬT KHẨU (MAGIC LINK)
  async function loginWithMagicLink(email) {
    const msg = document.getElementById('authMsg');
    const { data, error } = await sbClient.auth.signInWithOtp({
      email: email,
      options: {
        emailRedirectTo: window.location.origin + '/dashboard.html'
      }
    });
    if (error) {
      msg.innerHTML = `<i class="bi bi-dash-circle-fill"></i> Lỗi gửi liên kết: ${error.message}`;
      msg.className = "mt-4 text-center text-sm font-semibold text-red-500";
    } else {
      alert("✉️ Đã gửi link đăng nhập vào Email của bạn!");
    }
  }

  function toggleDarkMode() {
    if (document.documentElement.classList.contains('dark')) {
      document.documentElement.classList.remove('dark');
      localStorage.theme = 'light';
    } else {
      document.documentElement.classList.add('dark');
      localStorage.theme = 'dark';
    }
  }

  function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('svg');

    if (input.type === 'password') {
      input.type = 'text';
      icon.innerHTML = `
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.04 10.04 0 013.122-.563c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18" />
      `;
    } else {
      input.type = 'password';
      icon.innerHTML = `
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
      `;
    }
  }
</script>
</body>
</html>
