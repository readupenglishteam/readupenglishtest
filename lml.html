<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadUp English - Learning Materials Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/pages/lml.01.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/pages/lml.02.js"></script>
  <link rel="icon" type="image/png" href="https://i.ibb.co/wrPLDMMH/Xanh-Tr-ng-n-Gi-n-Bi-u-T-ng-Logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  

  <link rel="stylesheet" href="assets/compiled/lml.css">
</head>
<body class="bg-gray-50 dark:bg-zinc-950 dark:text-gray-100 min-h-screen transition-colors duration-300 flex flex-col justify-between">
<!-- Màn hình chờ: kiểm tra phiên trước khi hiển thị giao diện -->
<div id="ru-page-loader" class="ru-page-loader" role="status" aria-live="polite" aria-label="Đang kiểm tra phiên đăng nhập">
  <div class="ru-page-loader__center">
    <div class="ru-page-loader__brand">
      <img src="https://i.ibb.co/9m1LMnz3/Xanh-Tr-ng-n-Gi-n-Bi-u-T-ng-Logo-1.png" alt="ReadUp English Logo" width="64" height="64">
      <div class="ru-page-loader__name"><strong>ReadUp</strong><span>English</span></div>
    </div>
    <div class="ru-page-loader__track" aria-hidden="true"><span class="ru-page-loader__bar"></span></div>
    <span class="ru-page-loader__sr">Đang kiểm tra phiên đăng nhập...</span>
  </div>
</div>


<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none select-none bg-slate-50 dark:bg-zinc-950">
  <div class="absolute -top-24 -left-24 w-96 h-96 bg-[#cf1717]/20 dark:bg-[#cf1717]/15 rounded-full blur-3xl animate-blob"></div>
  <div class="absolute top-1/3 -right-24 w-[30rem] h-[30rem] bg-indigo-500/15 dark:bg-red-900/10 rounded-full blur-3xl animate-blob animation-delay-2000"></div>
  <div class="absolute -bottom-24 left-1/3 w-96 h-96 bg-amber-500/15 dark:bg-amber-600/10 rounded-full blur-3xl animate-blob animation-delay-4000"></div>
</div>

<div id="toastContainer" class="fixed top-5 right-5 z-[100000] flex flex-col gap-3 max-w-sm w-full pointer-events-none px-4 sm:px-0"></div>

<!-- ================= HEADER ================= -->
<header class="sticky top-0 z-40 backdrop-blur-md border-b border-gray-200/60 dark:border-zinc-800/60 bg-white/60 dark:bg-zinc-950/60 px-4">
  <div class="max-w-7xl mx-auto h-16 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <a href="dashboard.html" class="w-12 h-12 rounded-full bg-[#cf1717] flex items-center justify-center overflow-hidden flex-shrink-0 shadow-md hover:scale-105 transition">
        <img src="https://i.ibb.co/9m1LMnz3/Xanh-Tr-ng-n-Gi-n-Bi-u-T-ng-Logo-1.png" alt="ReadUp Logo" class="h-9 w-auto object-contain">
      </a>
      <a href="lml.html" class="flex items-center gap-2 hover:opacity-90 transition">
        <span class="text-2xl font-black text-[#cf1717] tracking-tight">ReadUp</span>
        <span class="text-xs font-bold text-white bg-[#cf1717] px-2 py-0.5 rounded-full shadow-sm">LML</span>
      </a>
    </div>
    <div class="flex items-center gap-2 sm:gap-3">
      <a id="adminLink" href="editLML.html" class="hidden px-3 py-2 text-xs font-bold text-[#cf1717] bg-white/80 dark:bg-zinc-800/80 border border-[#cf1717]/40 hover:bg-red-50 rounded-xl transition items-center gap-1.5"><i class="bi bi-pencil-square"></i><span class="hidden sm:inline">Edit LML</span></a>
      <a href="dashboard.html" class="px-3 py-2 text-xs font-bold text-gray-700 dark:text-gray-200 bg-gray-100 dark:bg-zinc-800 hover:bg-gray-200 dark:hover:bg-zinc-700 rounded-xl transition flex items-center gap-1.5"><i class="bi bi-house-door-fill"></i><span class="hidden sm:inline">Trang chủ</span></a>
      <button onclick="toggleDarkMode()" class="p-2 rounded-xl bg-gray-100/80 dark:bg-zinc-800/80 hover:bg-gray-200 dark:hover:bg-zinc-700 transition text-sm border border-gray-200/50 dark:border-zinc-700/50"><i class="bi bi-moon-stars-fill"></i></button>
      <a id="loginLink" href="index.html" class="hidden px-3 py-2 text-xs font-bold text-white bg-[#cf1717] hover:bg-red-700 rounded-xl transition"><i class="bi bi-box-arrow-in-right"></i> Đăng nhập</a>
      <button id="logoutBtn" onclick="handleLogout()" class="hidden px-3 py-2 text-xs font-bold bg-gray-100/80 dark:bg-zinc-800/80 hover:bg-red-100 dark:hover:bg-red-950/50 text-gray-700 dark:text-gray-300 hover:text-[#cf1717] rounded-xl transition">Đăng xuất</button>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-6 w-full flex-1">

  <!-- ============ CHẾ ĐỘ 1: DANH SÁCH ============ -->
  <div id="listView" class="space-y-8">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
      <!-- Thanh bên: chủ đề -->
      <aside class="lg:col-span-3 bg-white dark:bg-zinc-900 border dark:border-zinc-800 rounded-2xl shadow-sm overflow-hidden lg:sticky lg:top-20">
        <div class="bg-[#cf1717] text-white font-extrabold text-sm px-5 py-3.5 uppercase tracking-wide"><i class="bi bi-grid-fill"></i> Chủ đề</div>
        <div id="topicList"><p class="text-xs text-gray-400 italic p-4"><i class="bi bi-hourglass-split"></i> Đang tải...</p></div>
      </aside>

      <!-- Khu vực chính: bài trong chủ đề -->
      <section class="lg:col-span-9 bg-white dark:bg-zinc-900 border dark:border-zinc-800 rounded-2xl shadow-sm overflow-hidden">
        <div class="bg-[#cf1717] text-white px-5 py-3.5 flex items-center justify-between gap-3">
          <h2 id="listTitle" class="font-extrabold text-sm uppercase tracking-wide"><i class="bi bi-stars"></i> Bài mới</h2>
          <span id="listCount" class="text-[11px] font-bold bg-white/20 px-2.5 py-0.5 rounded-full">0 bài</span>
        </div>
        <div class="p-4 sm:p-6">
          <div id="matGrid" class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4"></div>
          <p id="matEmpty" class="hidden text-center text-gray-400 text-sm py-10">Chủ đề này chưa có bài nào.</p>
          <div id="pager" class="flex items-center justify-center gap-2 pt-5"></div>
        </div>
      </section>
    </div>

    <!-- Lịch sử điểm -->
    <section class="bg-white dark:bg-zinc-900 border dark:border-zinc-800 rounded-2xl shadow-sm p-4 sm:p-6 space-y-3">
      <div class="flex items-center justify-between border-l-4 border-[#cf1717] pl-3">
        <h2 class="text-base sm:text-lg font-extrabold text-gray-900 dark:text-white"><i class="bi bi-clock-history"></i> Lịch Sử Điểm Làm Bài</h2>
        <button onclick="loadHistory()" class="text-xs font-bold text-indigo-500 hover:underline"><i class="bi bi-arrow-clockwise"></i> Làm mới</button>
      </div>
      <div id="historyBox"><p class="text-xs text-gray-400 italic">Đang tải...</p></div>
      <div id="histPager" class="flex items-center justify-center gap-2"></div>
    </section>
  </div>

  <!-- ============ CHẾ ĐỘ 2: LÀM BÀI ============ -->
  <div id="attemptView" class="hidden space-y-5 max-w-5xl mx-auto">
    <div class="bg-white dark:bg-zinc-900 border dark:border-zinc-800 rounded-2xl p-4 sm:p-6 shadow-sm space-y-1 sticky top-16 z-20">
      <span id="atTopic" class="text-[10px] font-bold px-2 py-0.5 bg-red-100 dark:bg-red-950 text-[#cf1717] rounded-full"></span>
      <h2 id="atTitle" class="text-lg font-extrabold text-gray-900 dark:text-white"></h2>
      <p id="atDesc" class="text-xs text-gray-500"></p>
      <a id="backLink1" href="lml.html" class="inline-block text-xs font-bold text-gray-400 hover:text-[#cf1717]">← Quay lại thư viện</a>
    </div>
    <div id="questionArea" class="space-y-4"></div>
    <div class="flex justify-end pt-2">
      <button id="submitBtn" onclick="submitMaterial()" class="bg-[#cf1717] hover:bg-red-700 text-white font-extrabold px-8 py-3 rounded-2xl text-sm shadow-lg transition"><i class="bi bi-check-circle-fill"></i> Nộp Bài</button>
    </div>
  </div>

  <!-- ============ CHẾ ĐỘ 3: KẾT QUẢ ============ -->
  <div id="resultView" class="hidden space-y-5 max-w-5xl mx-auto">
    <div class="bg-white dark:bg-zinc-900 border dark:border-zinc-800 rounded-2xl p-6 text-center shadow-sm space-y-2">
      <div class="text-4xl text-[#cf1717]"><i class="bi bi-stars"></i></div>
      <h2 id="rsTitle" class="text-xl font-extrabold text-gray-900 dark:text-white">Kết quả</h2>
      <p class="text-sm text-gray-500">Điểm: <b id="rsScore" class="text-[#cf1717]"></b></p>
      <p id="rsNote" class="hidden text-xs text-amber-500"></p>
      <div class="flex flex-wrap justify-center gap-2 pt-1">
        <button onclick="retryMaterial()" class="px-4 py-2 bg-[#cf1717] hover:bg-red-700 text-white font-bold rounded-xl text-xs shadow transition"><i class="bi bi-arrow-repeat"></i> Làm lại</button>
        <a id="backLink2" href="lml.html" class="px-4 py-2 bg-gray-100 dark:bg-zinc-800 hover:bg-gray-200 dark:hover:bg-zinc-700 font-bold rounded-xl text-xs transition">← Quay lại thư viện</a>
      </div>
    </div>
    <div id="reviewArea" class="space-y-4"></div>
  </div>
</main>

<footer class="mt-auto pt-6">
  <div class="max-w-6xl mx-auto px-4 pb-4 text-center text-gray-400 dark:text-gray-600 text-[11px]">© 2026 ReadUp English. All rights reserved.</div>
</footer>


<script src="assets/compiled/lml.part1.js"></script>
</body>
</html>
