<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>ReadUp English - Check-in</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js" onerror="window.__jsqrFail=1"></script>
  <link rel="icon" type="image/png" href="https://i.ibb.co/wrPLDMMH/Xanh-Tr-ng-n-Gi-n-Bi-u-T-ng-Logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Montserrat',system-ui,sans-serif;background:#f1f5ff}
    .cam{position:relative;width:100%;aspect-ratio:1/1;border-radius:22px;overflow:hidden;background:#0b1220}
    .cam video{width:100%;height:100%;object-fit:cover}
    .cam video{transform:translateZ(0)}
    .cam .frame{position:absolute;inset:14%;border:3px solid rgba(255,255,255,.92);border-radius:22px;pointer-events:none}
    .cam .scanwrap{position:absolute;inset:14%;overflow:hidden;border-radius:20px;pointer-events:none}
    .cam .scanline{position:absolute;inset:0;transform:translate3d(0,-100%,0);will-change:transform;
      background:linear-gradient(to bottom,rgba(255,77,77,0) 70%,rgba(255,77,77,.28) 96%,#ff4d4d 100%);
      animation:sl 1.8s cubic-bezier(.45,0,.55,1) infinite alternate}
    @keyframes sl{from{transform:translate3d(0,-100%,0)}to{transform:translate3d(0,0,0)}}
    @media (prefers-reduced-motion:reduce){.cam .scanline{animation:none;transform:translate3d(0,-50%,0)}}
    /* Kết quả: tích xanh vẽ nét + vòng lan + pháo giấy */
    .okwrap{position:relative;width:104px;height:104px;margin:0 auto}
    .okwrap .ring{position:absolute;inset:0;border-radius:50%;border:3px solid #34d399;opacity:0;animation:ringpulse 1.1s ease-out .15s 2}
    @keyframes ringpulse{0%{transform:scale(.7);opacity:.8}100%{transform:scale(1.4);opacity:0}}
    .okwrap svg{position:relative;width:100%;height:100%;overflow:visible}
    .okwrap .disc{fill:#10b981;transform-origin:50% 50%;animation:discpop .45s cubic-bezier(.2,1.4,.4,1) both}
    .okwrap .tick{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .45s ease-out .3s forwards}
    .okwrap.already .disc{fill:#3b82f6}.okwrap.already .ring{border-color:#60a5fa;animation-iteration-count:1}
    .okwrap.bad .disc{fill:#ef4444}.okwrap.bad .ring{display:none}
    .okwrap .cross{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .4s ease-out .3s forwards}
    @keyframes discpop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
    @keyframes draw{to{stroke-dashoffset:0}}
    .rise{animation:rise .5s ease-out .45s both}@keyframes rise{from{transform:translate3d(0,10px,0);opacity:0}to{transform:none;opacity:1}}
    #confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
  </style>
</head>
<body class="min-h-screen text-gray-900">
  <header class="px-4 h-14 flex items-center justify-between bg-white/80 backdrop-blur border-b border-gray-200">
    <a href="assignment.html" class="font-bold text-sm text-gray-700"><i class="bi bi-arrow-left"></i> <span data-t="back">Back</span></a>
    <div class="font-black text-[#cf1717]">ReadUp <span class="text-[10px] bg-[#cf1717] text-white px-2 py-0.5 rounded-full align-middle">English</span></div>
    <div class="w-12"></div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">
    <h1 class="text-xl font-black" data-t="title">Class check-in</h1>

    <!-- Thông tin buổi học (khi mở bằng QR) -->
    <section id="infoCard" class="hidden bg-white rounded-2xl border border-gray-200 p-4 shadow-sm">
      <div id="infoClass" class="font-extrabold"></div>
      <div id="infoMeta" class="text-xs text-gray-500 mt-1"></div>
    </section>

    <!-- Kết quả -->
    <section id="resultCard" class="hidden text-center bg-white rounded-3xl border border-gray-200 p-8 shadow-sm"></section>

    <!-- Mật khẩu -->
    <section id="pwCard" class="hidden bg-white rounded-2xl border border-gray-200 p-4 shadow-sm space-y-3">
      <label class="block text-xs font-bold uppercase text-gray-500" data-t="pwLabel">Class password</label>
      <input id="pwInput" type="password" autocomplete="off" class="w-full p-3 rounded-xl border border-gray-300 text-lg tracking-widest" placeholder="••••">
      <button id="pwGo" class="w-full py-3 rounded-xl bg-[#cf1717] text-white font-extrabold" data-t="pwGo">Check in</button>
    </section>

    <!-- Máy quét + nhập mã -->
    <section id="scanCard" class="hidden space-y-3">
      <div class="cam" id="camBox"><video id="video" playsinline muted></video><div class="frame"></div><div class="scanwrap"><div class="scanline"></div></div></div>
      <p id="camMsg" class="text-xs text-center text-gray-500" data-t="camHint">Point the camera at the QR code on the teacher's screen.</p>
      <button id="camStart" class="hidden w-full py-3 rounded-xl bg-gray-900 text-white font-bold"><i class="bi bi-camera-video-fill"></i> <span data-t="camOn">Turn on camera</span></button>
      <label class="flex items-center justify-center gap-2 w-full py-3 rounded-xl border border-gray-300 bg-white text-sm font-bold text-gray-700 active:bg-gray-100">
        <i class="bi bi-image"></i> <span data-t="pickImg">Take / choose a photo of the QR</span>
        <input id="qrFile" type="file" accept="image/*" capture="environment" class="hidden">
      </label>
      <p class="text-[11px] text-center text-gray-400 leading-relaxed" data-t="altHint">Tip: you can also scan the QR with your phone's built-in Camera app — it opens this page and checks you in.</p>

    </section>

    <p id="statusLine" class="text-xs text-center text-gray-500"></p>
  </main>

  <script>
    const sb = supabase.createClient("https://klovtvjfvfenhkvifujy.supabase.co", "sb_publishable_WevQJCkdgfwbgnUoNu1SfA_Ec9hT49-");
    const $ = id => document.getElementById(id);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const lang = () => { try { return localStorage.getItem('readup-language') === 'vi' ? 'vi' : 'en'; } catch (e) { return 'en'; } };
    const D = {
      back: ['Quay lại', 'Back'], title: ['Điểm danh lớp học', 'Class check-in'], pwLabel: ['Mật khẩu điểm danh', 'Class password'], pwGo: ['Điểm danh', 'Check in'],
      camHint: ['Đưa camera vào mã QR trên màn hình của giáo viên.', "Point the camera at the QR code on the teacher's screen."],
      camOn: ['Bật camera', 'Turn on camera'],
      pickImg: ['Chụp / chọn ảnh chứa mã QR', 'Take / choose a photo of the QR'],
      altHint: ['Mẹo: bạn cũng có thể dùng app Camera có sẵn của điện thoại để quét QR — nó mở trang này và điểm danh luôn.', "Tip: you can also scan the QR with your phone's built-in Camera app — it opens this page and checks you in."],
      
    };
    const t = (vi, en) => lang() === 'vi' ? vi : en;
    document.querySelectorAll('[data-t]').forEach(e => { const d = D[e.dataset.t]; if (d) e.textContent = d[lang() === 'vi' ? 0 : 1]; });

    const ERR = {
      not_logged_in: ['Bạn chưa đăng nhập.', 'You are not signed in.'],
      not_open: ['Buổi này chưa mở điểm danh QR hoặc đã đóng.', 'QR check-in is not open (or has been closed) for this session.'],
      not_member: ['Bạn không thuộc lớp của buổi học này.', 'You are not enrolled in this class.'],
      too_early: ['Chưa tới giờ điểm danh.', 'Check-in has not started yet.'],
      too_late: ['Đã hết giờ điểm danh.', 'Check-in time is over.'],
      locked: ['Buổi này đã được giáo viên chốt điểm danh.', 'The teacher has already finalized attendance for this session.'],
      bad_code: ['Mã không đúng hoặc đã hết hạn. Hãy quét lại mã đang hiển thị.', 'Wrong or expired code. Scan the code currently on screen.'],
      need_password: ['Buổi này yêu cầu mật khẩu.', 'This session requires a password.'],
      bad_password: ['Sai mật khẩu.', 'Wrong password.'],
      need_location: ['Buổi này yêu cầu vị trí của bạn.', 'This session requires your location.'],
      blocked: ['Bạn nhập sai quá nhiều lần. Hãy đợi vài phút rồi thử lại.', 'Too many wrong attempts. Please wait a few minutes.']
    };
    const errText = (code, extra) => {
      if (code === 'too_far') return t(`Bạn đang cách lớp học khoảng ${extra.distance_m} m (cho phép ${extra.radius_m} m). Hãy vào đúng phòng học rồi thử lại.`, `You are about ${extra.distance_m} m from the classroom (allowed ${extra.radius_m} m). Please be in the room and try again.`);
      const e = ERR[code]; return e ? e[lang() === 'vi' ? 0 : 1] : t('Không điểm danh được: ', 'Could not check in: ') + code;
    };

    const params = new URLSearchParams(location.search);
    let sessionId = params.get('s'), code = params.get('c');
    let info = null, busy = false, stream = null, scanning = false;

    function hideAll() { ['pwCard', 'scanCard', 'resultCard'].forEach(i => $(i).classList.add('hidden')); }
    function confetti() {
      if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const cvs = document.createElement('canvas'); cvs.id = 'confetti'; document.body.appendChild(cvs);
      const dpr = Math.min(2, window.devicePixelRatio || 1), W = cvs.width = innerWidth * dpr, H = cvs.height = innerHeight * dpr, g = cvs.getContext('2d');
      const cols = ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#a855f7', '#ec4899'];
      const ox = W / 2, oy = H * 0.32;
      const ps = Array.from({ length: 70 }, () => { const a = Math.random() * Math.PI * 2, sp = (6 + Math.random() * 9) * dpr; return { x: ox, y: oy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 6 * dpr, r: (4 + Math.random() * 5) * dpr, c: cols[(Math.random() * cols.length) | 0], rot: Math.random() * 6, vr: (Math.random() - .5) * .4 }; });
      let last = performance.now(), life = 0;
      (function frame(now) {
        const dt = Math.min(2, (now - last) / 16.7); last = now; life += dt;
        g.clearRect(0, 0, W, H);
        for (const p of ps) { p.vy += .32 * dpr * dt; p.vx *= .992; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.globalAlpha = Math.max(0, 1 - life / 95); g.fillStyle = p.c; g.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); g.restore(); }
        if (life < 95) requestAnimationFrame(frame); else cvs.remove();
      })(last);
    }
    function showResult(ok, title, text, extra, kind) {
      stopCamera(); hideAll();
      const r = $('resultCard'); r.classList.remove('hidden');
      const k = ok ? (kind || 'ok') : 'bad';
      const glyph = k === 'bad' ? '<path class="cross" d="M38 38 L66 66 M66 38 L38 66"/>' : '<path class="tick" d="M34 54 L48 68 L72 40"/>';
      r.innerHTML = `<div class="okwrap ${k === 'already' ? 'already' : k === 'bad' ? 'bad' : ''}"><span class="ring"></span><svg viewBox="0 0 104 104" aria-hidden="true"><circle class="disc" cx="52" cy="52" r="48"/>${glyph}</svg></div>
        <div class="rise mt-5 text-2xl font-black ${k === 'bad' ? 'text-gray-900' : k === 'already' ? 'text-blue-700' : 'text-emerald-700'}">${esc(title)}</div><p class="rise mt-1.5 text-sm text-gray-600 leading-relaxed">${esc(text)}</p>${extra || ''}
        <div class="rise mt-6 flex gap-2 justify-center">
          ${ok ? '' : `<button onclick="location.href='checkin.html'" class="px-4 py-2.5 rounded-xl bg-[#cf1717] text-white font-bold text-sm">${esc(t('Quét lại', 'Scan again'))}</button>`}
          <a href="assignment.html" class="px-4 py-2.5 rounded-xl ${ok ? 'bg-gray-900 text-white' : 'border'} font-bold text-sm">${esc(t('Về trang học', 'Back to class page'))}</a>
        </div>`;
      try { if (navigator.vibrate) navigator.vibrate(k === 'ok' ? [60, 50, 120] : k === 'already' ? 40 : [200]); } catch (e) {}
      if (k === 'ok') setTimeout(confetti, 250);
    }

    function getPosition() {
      return new Promise((res, rej) => {
        if (!navigator.geolocation) return rej(new Error('no_geo'));
        navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }), rej, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
      });
    }

    async function submit(pw) {
      if (busy) return; busy = true;
      $('statusLine').textContent = t('Đang điểm danh…', 'Checking in…');
      try {
        let pos = { lat: null, lng: null, acc: null };
        if (!info || info.needs_location) {
          try { pos = await getPosition(); }
          catch (e) {
            if (info && info.needs_location) {
              busy = false; $('statusLine').textContent = '';
              return showResult(false, t('Cần quyền vị trí', 'Location permission needed'), t('Hãy bật Vị trí cho trình duyệt (Cài đặt → Quyền → Vị trí) rồi quét lại.', 'Allow Location for your browser (Settings → Permissions → Location), then scan again.'));
            }
          }
        }
        const { data, error } = await sb.rpc('qr_student_check_in', { p_session_id: sessionId, p_code: code, p_password: pw || null, p_lat: pos.lat, p_lng: pos.lng, p_accuracy: pos.acc });
        if (error) { showResult(false, t('Lỗi', 'Error'), error.message + (/function|schema cache/i.test(error.message) ? ' — ' + t('quản trị chưa chạy 2_qr_attendance.sql.', 'admin has not run 2_qr_attendance.sql yet.') : '')); return; }
        if (data.ok) {
          const st = data.status;
          const label = st === 'L' ? t('Có mặt (đi muộn)', 'Present (late)') : t('Có mặt', 'Present');
          const badge = `<div class="rise mt-4 inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-extrabold ${st === 'L' ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700'}">${esc(label)}${data.distance_m != null ? ' · ' + data.distance_m + ' m' : ''}</div>`;
          if (data.already) showResult(true, t('Bạn đã điểm danh rồi ✓', 'You are already checked in ✓'), t('Hệ thống đã ghi nhận buổi học này cho bạn — bạn không cần quét lại, cứ yên tâm nhé.', 'Your attendance for this session is already recorded — no need to scan again.'), badge, 'already');
          else showResult(true, t('Điểm danh thành công! 🎉', 'Checked in! 🎉'), t('Chúc bạn học thật tốt buổi hôm nay.', 'Have a great class today.'), badge, 'ok');
        } else if (data.error === 'need_password' || data.error === 'bad_password') {
          hideAll(); $('pwCard').classList.remove('hidden'); $('pwInput').focus();
          $('statusLine').textContent = data.error === 'bad_password' ? errText('bad_password') : '';
          if (data.error === 'need_password') $('statusLine').textContent = errText('need_password');
        } else { showResult(false, t('Chưa điểm danh được', 'Check-in failed'), errText(data.error, data)); }
      } catch (e) { showResult(false, t('Lỗi', 'Error'), e.message || String(e)); }
      finally { busy = false; if (!$('pwCard').classList.contains('hidden')) return; $('statusLine').textContent = ''; }
    }

    // ---------- Máy quét QR ----------
    // Nạp jsQR từ CDN dự phòng nếu CDN đầu bị chặn (mạng trường học hay chặn cdnjs)
    function loadScript(src) { return new Promise(res => { const el = document.createElement('script'); el.src = src; el.onload = () => res(true); el.onerror = () => res(false); document.head.appendChild(el); }); }
    async function ensureJsQR() {
      if (window.jsQR) return true;
      for (const u of ['https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js', 'https://unpkg.com/jsqr@1.4.0/dist/jsQR.js']) { if (await loadScript(u) && window.jsQR) return true; }
      return !!window.jsQR;
    }
    async function startCamera() {
      await ensureJsQR();
      $('camStart').classList.add('hidden');
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
        const v = $('video'); v.srcObject = stream; await v.play();
        // lấy nét liên tục nếu máy hỗ trợ
        try { const tr = stream.getVideoTracks()[0]; const caps = tr.getCapabilities ? tr.getCapabilities() : {}; if (caps.focusMode && caps.focusMode.includes('continuous')) await tr.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {}
        if (!detector && 'BarcodeDetector' in window) { try { detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { detector = null; } }
        if (!detector && !window.jsQR) $('camMsg').textContent = t('Chưa tải được bộ đọc QR — kiểm tra mạng rồi tải lại trang, hoặc dùng nút chọn ảnh / app Camera của máy.', 'QR reader failed to load — check your connection and reload, or use the photo button / your phone Camera app.');
        else $('camMsg').textContent = t('Đang quét… giữ mã QR trong khung, cách khoảng 20–30 cm.', 'Scanning… keep the QR inside the frame, about 20–30 cm away.');
        scanning = true; requestAnimationFrame(scanLoop);
      } catch (e) {
        $('camMsg').textContent = t('Không mở được camera — hãy cho phép Máy ảnh trong Cài đặt, hoặc dùng app Camera của điện thoại để quét QR.', 'Camera unavailable — allow Camera in Settings, or use your phone camera app to scan the QR.');
        $('camStart').classList.remove('hidden');
      }
    }
    function stopCamera() { scanning = false; if (stream) { stream.getTracks().forEach(tr => tr.stop()); stream = null; } }
    const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
    let lastScan = 0, detector = null, detecting = false, lastBad = '';
    let frameNo = 0;
    function grab(v, maxW) {
      const w = Math.min(maxW, v.videoWidth), h = Math.round(w * v.videoHeight / v.videoWidth);
      if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
      cx.drawImage(v, 0, 0, w, h); return { w, h };
    }
    async function decodeFrame(v) {
      if (detector) { try { const r = await detector.detect(v); if (r && r.length && r[0].rawValue) return r[0].rawValue; } catch (e) {} return null; }
      if (!window.jsQR) return null;
      // Lượt nhẹ (720px, không đảo màu) mỗi lần; cứ 4 lượt mới thử lượt kỹ (1280px + đảo màu) → mượt hơn nhiều
      const deep = (++frameNo % 4) === 0;
      const { w, h } = grab(v, deep ? 1280 : 720);
      const r = jsQR(cx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: deep ? 'attemptBoth' : 'dontInvert' });
      return r && r.data ? r.data : null;
    }
    async function scanLoop(ts) {
      if (!scanning) return;
      const v = $('video');
      if (v.readyState >= 2 && v.videoWidth && ts - lastScan > 140 && !detecting) {
        lastScan = ts; detecting = true;
        try {
          const text = await decodeFrame(v);
          if (text && scanning) {
            if (handleScanned(text)) { detecting = false; return; }
            if (text !== lastBad) { lastBad = text; $('camMsg').textContent = t('Đã thấy một mã QR nhưng không phải mã điểm danh — hãy quét mã trên màn hình giáo viên.', 'Found a QR code, but it is not an attendance code — scan the code on the teacher screen.'); }
          }
        } catch (e) {}
        detecting = false;
      }
      requestAnimationFrame(scanLoop);
    }
    // Đọc mã từ ảnh chụp/chọn (dự phòng khi quét trực tiếp không nhận)
    $('qrFile').addEventListener('change', async e => {
      const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
      $('camMsg').textContent = t('Đang đọc ảnh…', 'Reading photo…');
      try {
        await ensureJsQR();
        const bmp = await createImageBitmap(f);
        const sc = Math.min(1, 1600 / Math.max(bmp.width, bmp.height)), w = Math.round(bmp.width * sc), h = Math.round(bmp.height * sc);
        cv.width = w; cv.height = h; cx.drawImage(bmp, 0, 0, w, h);
        let text = null;
        if (!detector && 'BarcodeDetector' in window) { try { detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (er) {} }
        if (detector) { try { const r = await detector.detect(cv); if (r.length) text = r[0].rawValue; } catch (er) {} }
        if (!text && window.jsQR) { const r = jsQR(cx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'attemptBoth' }); if (r) text = r.data; }
        if (text && handleScanned(text)) return;
        $('camMsg').textContent = text ? t('Ảnh có mã QR nhưng không phải mã điểm danh.', 'That QR is not a check-in code.') : t('Không thấy mã QR trong ảnh — chụp gần và rõ hơn rồi thử lại.', 'No QR found in the photo — take a closer, sharper photo.');
      } catch (er) { $('camMsg').textContent = t('Không đọc được ảnh: ', 'Could not read the photo: ') + (er.message || er); }
    });
    function flashScan() {
      try { if (navigator.vibrate) navigator.vibrate([80, 40, 80]); } catch (e) {}
      const f = $('camBox'), o = document.createElement('div');
      o.style.cssText = 'position:absolute;inset:0;background:#22c55e;opacity:.55;pointer-events:none;will-change:opacity';
      f.appendChild(o);
      o.animate([{ opacity: .6 }, { opacity: 0 }], { duration: 420, easing: 'ease-out' }).onfinish = () => o.remove();
      f.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.03)' }, { transform: 'scale(1)' }], { duration: 260, easing: 'ease-out' });
    }
    // Chấp nhận mọi dạng: URL đầy đủ (bất kể tên miền / có hay không đuôi .html) hoặc chuỗi "s=...&c=..."
    function parseScan(text) {
      text = String(text || '').trim();
      let qs = '';
      try { qs = new URL(text).search; } catch (e) { const i = text.indexOf('?'); qs = i >= 0 ? text.slice(i) : text; }
      const sp = new URLSearchParams(qs.replace(/^\?/, ''));
      const s = sp.get('s'), c = sp.get('c');
      return s && c ? { s, c } : null;
    }
    function handleScanned(text) {
      const r = parseScan(text); if (!r) return false;
      flashScan(); stopCamera();
      sessionId = r.s; code = r.c; begin(); return true;
    }

    // ---------- Luồng chính ----------
    async function begin() {
      hideAll();
      const ir = await sb.rpc('qr_student_session_info', { p_session_id: sessionId });
      if (ir.error) return showResult(false, t('Lỗi', 'Error'), ir.error.message + (/function|schema cache/i.test(ir.error.message) ? ' — ' + t('quản trị chưa chạy 2_qr_attendance.sql.', 'admin has not run 2_qr_attendance.sql yet.') : ''));
      info = ir.data;
      if (!info || !info.ok) return showResult(false, t('Không tìm thấy buổi học', 'Session not found'), errText('not_open'));
      $('infoCard').classList.remove('hidden');
      $('infoClass').textContent = (info.class_code ? info.class_code + ' — ' : '') + (info.class_title || '');
      $('infoMeta').textContent = [info.subject_name, String(info.session_date).slice(0, 10).split('-').reverse().join('/'), info.session_time].filter(Boolean).join(' · ') +
        (info.needs_location ? ' · 📍' : '') + (info.needs_password ? ' · 🔑' : '');
      if (!info.in_window) return showResult(false, t('Ngoài khung giờ điểm danh', 'Outside check-in time'), errText('not_open'));
      if (info.needs_password) { $('pwCard').classList.remove('hidden'); $('pwInput').focus(); $('pwGo').onclick = () => submit($('pwInput').value); $('pwInput').onkeydown = e => { if (e.key === 'Enter') submit($('pwInput').value); }; return; }
      submit();
    }

    async function showScanner() {
      hideAll(); $('infoCard').classList.add('hidden'); $('scanCard').classList.remove('hidden');
      startCamera();
      $('camStart').onclick = startCamera;
    }

    (async function init() {
      let { data: { session } } = await sb.auth.getSession();
      if (!session) { await new Promise(r => setTimeout(r, 700)); ({ data: { session } } = await sb.auth.getSession()); }
      if (!session) { location.replace('login.html?next=' + encodeURIComponent('checkin.html' + location.search)); return; }
      if (sessionId && code) begin(); else showScanner();
    })();
    window.addEventListener('pagehide', stopCamera);
  </script>
</body>
</html>
