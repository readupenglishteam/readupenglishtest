<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>ReadUp English - Mã QR Điểm Danh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <link rel="icon" type="image/png" href="https://i.ibb.co/wrPLDMMH/Xanh-Tr-ng-n-Gi-n-Bi-u-T-ng-Logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>body{font-family:'Montserrat',system-ui,sans-serif;background:#fff7f7}</style>
</head>
<body class="min-h-screen">
  <header class="px-4 py-3 flex flex-wrap items-center justify-between gap-3 border-b border-red-100 bg-white">
    <div class="min-w-0">
      <div class="text-xl font-black text-[#cf1717]"><i class="bi bi-qr-code-scan"></i> Điểm danh bằng mã QR</div>
      <div id="sub" class="text-xs text-gray-500 truncate">Đang tải…</div>
    </div>
    <div class="flex items-center gap-2">
      <button id="btnFs" class="px-3 py-2 rounded-lg border font-bold text-xs hover:border-[#cf1717] hover:text-[#cf1717]"><i class="bi bi-arrows-fullscreen"></i> Toàn màn hình</button>
      <button id="btnClose" class="px-3 py-2 rounded-lg bg-gray-800 text-white font-bold text-xs hover:bg-black"><i class="bi bi-stop-circle"></i> Đóng mã</button>
    </div>
  </header>
  <main class="max-w-6xl mx-auto p-4 sm:p-6">
    <div id="msg" class="hidden mb-4 p-3 rounded-xl bg-red-50 border border-red-200 text-sm font-bold text-red-700"></div>
    <div id="view"></div>
  </main>

  <script src="assets/js/ru-qr-view.js?v=20261123"></script>
  <script>
    const sb = supabase.createClient("https://klovtvjfvfenhkvifujy.supabase.co", "sb_publishable_WevQJCkdgfwbgnUoNu1SfA_Ec9hT49-");
    const sid = new URLSearchParams(location.search).get('s');
    const $ = id => document.getElementById(id);
    function fail(t) { $('msg').textContent = t; $('msg').classList.remove('hidden'); $('sub').textContent = ''; }
    (async () => {
      if (!sid) return fail('Thiếu mã buổi học (?s=...). Hãy mở trang này từ nút “Mở trang chiếu mã” trong Điểm danh của giáo viên.');
      let { data: { session } } = await sb.auth.getSession();
      if (!session) { await new Promise(r => setTimeout(r, 700)); ({ data: { session } } = await sb.auth.getSession()); }
      if (!session) return fail('Bạn chưa đăng nhập. Hãy đăng nhập tài khoản giáo viên ở trang chủ rồi mở lại trang này.');
      const { data, error } = await sb.rpc('qr_teacher_current', { p_session_id: sid });
      if (error) return fail('Lỗi: ' + error.message + ' — đã chạy 2_qr_attendance.sql trong Supabase chưa?');
      if (!data || !data.ok) return fail(data && data.error === 'forbidden' ? 'Tài khoản này không có quyền với lớp của buổi học này.' : 'Buổi này chưa bật mã QR — hãy bật trong cửa sổ Điểm danh của giáo viên.');
      const d = data;
      $('sub').textContent = (d.class_code || '') + ' — ' + (d.class_title || '') + (d.subject_name ? ' · ' + d.subject_name : '') + ' · ' + String(d.session_date).slice(0, 10).split('-').reverse().join('/') + ' · ' + (d.session_time || '');
      document.title = 'QR điểm danh — ' + (d.class_code || '');
      RUQRView.mount($('view'), { sb, sessionId: sid, compact: false });
      $('btnFs').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); };
      $('btnClose').onclick = async () => {
        if (!confirm('Đóng mã QR của buổi này? Học sinh sẽ không quét được nữa.')) return;
        const r = await sb.rpc('qr_teacher_close', { p_session_id: sid });
        if (r.error || !r.data || !r.data.ok) return alert('Không đóng được: ' + ((r.error && r.error.message) || (r.data && r.data.error)));
      };
    })();
  </script>
</body>
</html>
