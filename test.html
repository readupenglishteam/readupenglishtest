<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReadUp English - Phòng thi</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/js/pages/test.01.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/pages/test.02.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="icon" type="image/png" href="https://i.ibb.co/wrPLDMMH/Xanh-Tr-ng-n-Gi-n-Bi-u-T-ng-Logo.png">
<link rel="preconnect" href="https://i.ibb.co" crossorigin>
<link rel="preload" as="image" href="https://i.ibb.co/9m1LMnz3/Xanh-Tr-ng-n-Gi-n-Bi-u-T-ng-Logo-1.png" fetchpriority="high">
<link rel="preload" as="image" href="https://i.ibb.co/YFwT790Y/Nh-m-h-c-ti-ng-Anh-Read-Up-n-ng-ng.png" media="(min-width:1024px)">
<link rel="stylesheet" href="assets/css/pages/test.01.css">
  <link rel="stylesheet" href="assets/css/page-loader.css">
<link rel="stylesheet" href="assets/css/ru-base.css">
</head>
<body class="bg-slate-50 dark:bg-zinc-950 text-gray-800 dark:text-gray-100 min-h-screen">
<!-- Màn hình chờ: kiểm tra phiên trước khi hiển thị giao diện -->
<div id="ru-page-loader" class="ru-page-loader" role="status" aria-live="polite" aria-label="Đang kiểm tra phiên đăng nhập">
  <div class="ru-page-loader__center">
    <div class="ru-page-loader__brand">
      <img src="https://i.ibb.co/9m1LMnz3/Xanh-Tr-ng-n-Gi-n-Bi-u-T-ng-Logo-1.png" alt="ReadUp English Logo" width="64" height="64">
      <div class="ru-page-loader__name"><strong>ReadUp</strong><span>English</span></div>
    </div>
    <div class="ru-page-loader__track" aria-hidden="true"><span class="ru-page-loader__bar"></span></div>
    <span class="ru-page-loader__sr">Đang kiểm tra phiên đăng nhập...</span>
  </div>
</div>

<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none bg-slate-50 dark:bg-zinc-950">
  <div class="absolute -top-24 -left-24 w-96 h-96 bg-[#cf1717]/20 dark:bg-[#cf1717]/15 rounded-full blur-3xl animate-blob"></div>
  <div class="absolute top-1/3 -right-24 w-[30rem] h-[30rem] bg-indigo-500/15 dark:bg-red-900/10 rounded-full blur-3xl animate-blob d2"></div>
  <div class="absolute -bottom-24 left-1/3 w-96 h-96 bg-amber-500/15 dark:bg-amber-600/10 rounded-full blur-3xl animate-blob d4"></div>
</div>
<div id="toast" class="fixed top-5 right-5 z-[100000] flex flex-col gap-2 max-w-sm pointer-events-none"></div>

<!-- ===== MÀN HÌNH CHÍNH (không header) ===== -->
<main id="app" class="max-w-3xl mx-auto px-4 py-10 sm:py-16"></main>

<!-- ===== PHÒNG THI ===== -->
<div id="exam" class="hidden fixed inset-0 z-[9000] bg-slate-50 dark:bg-zinc-950 overflow-y-auto">
  <div class="sticky top-0 z-10 bg-white/90 dark:bg-zinc-900/90 backdrop-blur border-b border-[#cf1717]/30 px-4 py-3 flex items-center justify-between gap-3">
    <div class="min-w-0"><div id="exTitle" class="font-extrabold text-[#cf1717] truncate"></div><div id="exWho" class="text-xs text-gray-500 truncate"></div></div>
    <div class="flex items-center gap-3 flex-shrink-0">
      <span id="exViol" class="text-xs font-bold px-2 py-1 rounded-lg bg-amber-100 text-amber-800">Cảnh báo 0/3</span>
      <span id="exTimer" class="font-mono font-black text-lg px-3 py-1 rounded-xl bg-[#cf1717] text-white">--:--</span>
    </div>
  </div>
  <div class="xwrap max-w-5xl mx-auto px-4 py-6">
    <p id="exDesc" class="nrm text-sm text-gray-500 mb-4"></p>
    <div id="exQs" class="space-y-4"></div>
    <button onclick="confirmSubmit()" class="nrm block mt-6 w-full py-3.5 rounded-2xl bg-[#cf1717] text-white font-extrabold shadow-lg hover:bg-red-700 transition">Nộp bài</button>
  </div>
</div>

<!-- ===== MODAL DÙNG CHUNG ===== -->
<div id="modal" class="hidden fixed inset-0 z-[9500] bg-black/70 backdrop-blur-sm items-center justify-center p-4">
  <div id="modalBox" class="bg-white dark:bg-zinc-900 rounded-3xl shadow-2xl p-6 w-full max-w-md"></div>
</div>

<script src="assets/js/pages/test.03.js"></script>
<script src="assets/js/page-loader.js"></script>
</body>
</html>
