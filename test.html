<style>
  html,body,input,textarea,button,select{font-family:'Montserrat',ui-sans-serif,system-ui,sans-serif}
  @keyframes blob{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-50px) scale(1.1)}66%{transform:translate(-20px,20px) scale(.95)}}
  .animate-blob{animation:blob 10s infinite ease-in-out}.d2{animation-delay:2s}.d4{animation-delay:4s}
  /* CHỐNG SAO CHÉP: chỉ ô nhập liệu mới được chọn/gõ */
  body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  input[type=text],textarea{-webkit-user-select:text;user-select:text}
  .qc{line-height:1.8;font-size:.97rem;word-wrap:break-word}
  .qc img{max-width:100%;border-radius:10px;margin:.5em 0;pointer-events:none}
  .qc table{border-collapse:collapse;width:100%;margin:.6em 0;font-size:.9em}
  .qc td,.qc th{border:1px solid #d1d5db;padding:6px 8px}.dark .qc td,.dark .qc th{border-color:#52525b}
  .qc ul{list-style:disc;padding-left:1.6em}.qc ol{list-style:decimal;padding-left:1.6em}
  .qc audio{width:100%}.two{column-count:2;column-gap:1.8rem}@media(max-width:640px){.two{column-count:1}}
  .gap{display:inline-block;width:7.5rem;margin:0 .25rem;padding:.1rem .5rem;border-bottom:2px solid #cf1717;background:rgba(207,23,23,.06);border-radius:6px 6px 0 0;outline:none;text-align:center;font-weight:700}
  .opt{display:flex;gap:.6rem;align-items:flex-start;padding:.6rem .8rem;border:1.5px solid #e5e7eb;border-radius:12px;cursor:pointer;transition:.15s}
  .dark .opt{border-color:#3f3f46}.opt:hover{border-color:#cf1717}.opt.sel{border-color:#cf1717;background:rgba(207,23,23,.08)}
  .opt.ok{border-color:#10b981;background:rgba(16,185,129,.12)}.opt.bad{border-color:#ef4444;background:rgba(239,68,68,.1)}
  .rsplit{max-width:60rem;margin-left:auto;margin-right:auto;display:grid;grid-template-columns:1fr 1fr;gap:1rem;height:calc(100vh - 7.5rem);height:calc(100dvh - 7.5rem);min-height:420px}
  .reading-mode .rsplit{height:calc(100vh - 5.6rem);height:calc(100dvh - 5.6rem)}
  .reading-mode .xwrap{padding-top:.75rem;padding-bottom:.75rem}
  .rhead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:.5rem;padding:.45rem .9rem;border-radius:12px;background:#cf1717;color:#fff;font-weight:800;font-size:.75rem;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 2px 8px rgba(207,23,23,.25)}
  .rsplit .pane+.pane>*{flex-shrink:0}
  .rsplit>.pane{overflow-y:auto;overscroll-behavior:contain;padding-right:.25rem}
  .rsplit>.pane::-webkit-scrollbar{width:8px}.rsplit>.pane::-webkit-scrollbar-thumb{background:#cf1717;border-radius:8px}
  .rsplit .pane+.pane{display:flex;flex-direction:column;gap:1rem}
  @media(max-width:860px){.rsplit,.reading-mode .rsplit{display:block;height:auto;min-height:0}.rsplit>.pane{overflow:visible}.rsplit>.pane:first-child{position:sticky;top:4.1rem;z-index:6;max-height:42vh;overflow-y:auto;margin-bottom:1rem;padding-bottom:.5rem;background:#f8fafc}.dark .rsplit>.pane:first-child{background:#09090b}.rsplit>.pane+.pane .rhead{position:static}.rsplit .pane+.pane{gap:1rem}}
  .nrm{max-width:48rem;margin-left:auto;margin-right:auto}
  @media(min-width:1024px){#app.info-wide{max-width:76rem}}
  @media print{body{display:none!important}}
</style>

<!-- ===== MÀN HÌNH CHÍNH (không header) ===== -->
<main id="app" class="max-w-3xl mx-auto px-4 py-10 sm:py-16"></main>

<!-- ===== PHÒNG THI ===== -->
<div id="exam" class="hidden fixed inset-0 z-[9000] bg-slate-50 dark:bg-zinc-950 overflow-y-auto">
  <div class="sticky top-0 z-10 bg-white/90 dark:bg-zinc-900/90 backdrop-blur border-b border-[#cf1717]/30 px-4 py-3 flex items-center justify-between gap-3">
    <div class="min-w-0"><div id="exTitle" class="font-extrabold text-[#cf1717] truncate"></div><div id="exWho" class="text-xs text-gray-500 truncate"></div></div>
    <div class="flex items-center gap-3 flex-shrink-0">
      <span id="exViol" class="text-xs font-bold px-2 py-1 rounded-lg bg-amber-100 text-amber-800">Cảnh báo 0/3</span>
      <span id="exTimer" class="font-mono font-black text-lg px-3 py-1 rounded-xl bg-[#cf1717] text-white">--:--</span>
    </div>
  </div>
  <div class="xwrap max-w-5xl mx-auto px-4 py-6">
    <p id="exDesc" class="nrm text-sm text-gray-500 mb-4"></p>
    <div id="exQs" class="space-y-4"></div>
    <button onclick="confirmSubmit()" class="nrm block mt-6 w-full py-3.5 rounded-2xl bg-[#cf1717] text-white font-extrabold shadow-lg hover:bg-red-700 transition">Nộp bài</button>
  </div>
</div>
