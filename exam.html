<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadUp English - Phòng Thi Reading</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>// BẮT BUỘC: Bảo Tailwind lắng nghe class "dark" ở thẻ <html> 
    tailwind.config = {
    darkMode: 'class'}
</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <link rel="icon" type="image/png" href="https://i.ibb.co/wrPLDMMH/Xanh-Tr-ng-n-Gi-n-Bi-u-T-ng-Logo.png">
</head>
<body class="bg-gray-100 dark:bg-zinc-950 dark:text-gray-100 h-screen flex flex-col overflow-hidden transition-colors duration-300">

  <!-- Header -->
  <header class="bg-white dark:bg-zinc-900 border-b dark:border-zinc-800 h-16 flex-none z-40 shadow-sm px-4">
    <div class="max-w-7xl mx-auto h-full flex justify-between items-center">
      <div class="flex items-center gap-2 sm:gap-3">
        <a href="dashboard.html" class="text-xs font-bold text-gray-500 hover:text-[#cf1717] transition">← Quay lại</a>
        <h1 id="examHeaderTitle" class="font-extrabold text-sm sm:text-lg text-gray-900 dark:text-white truncate max-w-[150px] sm:max-w-md">Đang tải đề thi...</h1>
      </div>

      <div class="flex items-center gap-2 sm:gap-4">
        <!-- Nút Highlight -->
        <button onclick="highlightSelectedText()" class="px-2.5 sm:px-3 py-1.5 bg-amber-100 dark:bg-amber-900/60 text-amber-800 dark:text-amber-200 font-bold text-xs rounded-lg border border-amber-300 dark:border-amber-700 hover:opacity-80 transition flex items-center gap-1">
          🖍️ <span class="hidden sm:inline">Highlight văn bản</span>
        </button>

        <!-- Timer -->
        <div class="flex items-center gap-1 sm:gap-1.5 px-2.5 sm:px-3 py-1.5 bg-red-50 dark:bg-red-950/80 rounded-lg border border-red-200 dark:border-red-900">
          <span class="text-xs font-bold text-[#cf1717]">⏱️</span>
          <span id="timerDisplay" class="font-mono font-extrabold text-xs sm:text-base text-[#cf1717]">00:00</span>
        </div>

        <!-- Nút Nộp Bài Thi -->
        <button onclick="confirmSubmitExam()" class="px-3 sm:px-4 py-1.5 sm:py-2 bg-[#cf1717] hover:bg-red-700 text-white font-bold text-xs sm:text-sm rounded-lg shadow transition">Nộp Bài Thi</button>

        <!-- Nút Chuyển Dark Mode -->
        <button onclick="toggleDarkMode()" class="p-2 rounded-full bg-gray-100 dark:bg-zinc-800 text-sm">🌙 / ☀️</button>
      </div>
    </div>
  </header>

  <!-- THANH CHUYỂN TAB TRÊN ĐIỆN THOẠI -->
  <div class="lg:hidden flex border-b border-gray-200 dark:border-zinc-800 bg-white dark:bg-zinc-900">
    <button id="mobileTabReading" onclick="switchMobileTab('reading')" class="w-1/2 py-2.5 text-center font-bold text-xs text-[#cf1717] border-b-2 border-[#cf1717]">
      📖 Bài Đọc (Passage)
    </button>
    <button id="mobileTabQuestions" onclick="switchMobileTab('questions')" class="w-1/2 py-2.5 text-center font-bold text-xs text-gray-400">
      ✍️ Câu Hỏi (Questions)
    </button>
  </div>

  <!-- NỘI DUNG LÀM BÀI -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-2 sm:p-4 grid grid-cols-1 lg:grid-cols-2 gap-4 lg:gap-6 overflow-hidden">
    
    <!-- CỘT BÀI ĐỌC (CUỘN ĐỘC LẬP) -->
    <section id="readingSection" class="bg-white dark:bg-zinc-900 border dark:border-zinc-800 rounded-2xl p-4 sm:p-6 h-full overflow-y-auto shadow-sm space-y-4">
      <div class="flex items-center justify-between border-b dark:border-zinc-800 pb-3 sticky top-0 bg-white dark:bg-zinc-900 z-10">
        <h2 class="font-extrabold text-base sm:text-lg text-gray-900 dark:text-white flex items-center gap-2">📖 Reading Passage</h2>
        <span id="examTopicTag" class="text-xs font-bold px-2.5 py-1 bg-red-50 dark:bg-red-950 text-[#cf1717] rounded-full">General</span>
      </div>
      <div id="passageContent" class="prose dark:prose-invert max-w-none text-xs sm:text-sm leading-relaxed text-gray-700 dark:text-gray-300 select-text">
        <p class="text-gray-400">⏳ Đang tải nội dung đoạn văn...</p>
      </div>
    </section>

    <!-- CỘT CÂU HỎI (CUỘN ĐỘC LẬP) -->
    <section id="questionsSection" class="hidden lg:block bg-white dark:bg-zinc-900 border dark:border-zinc-800 rounded-2xl p-4 sm:p-6 h-full overflow-y-auto shadow-sm">
      <div class="space-y-6">
        <div class="flex items-center justify-between border-b dark:border-zinc-800 pb-3 sticky top-0 bg-white dark:bg-zinc-900 z-10">
          <h2 class="font-extrabold text-base sm:text-lg text-gray-900 dark:text-white flex items-center gap-2">✍️ Questions</h2>
          <span id="questionCountTag" class="text-xs font-bold text-gray-500">0 câu hỏi</span>
        </div>
        <form id="questionsForm" class="space-y-6">
          <p class="text-gray-400 text-sm">⏳ Đang tải danh sách câu hỏi...</p>
        </form>
      </div>
    </section>

  </main>

  <!-- MODAL KẾT QUẢ -->
  <div id="resultModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white dark:bg-zinc-900 border dark:border-zinc-800 rounded-2xl p-6 sm:p-8 w-full max-w-md shadow-2xl text-center space-y-5 sm:space-y-6">
      <div class="w-14 h-14 sm:w-16 sm:h-16 bg-red-50 dark:bg-red-950 text-[#cf1717] rounded-full flex items-center justify-center text-2xl sm:text-3xl mx-auto">🏆</div>
      <div>
        <h3 class="text-xl sm:text-2xl font-extrabold text-gray-900 dark:text-white">Hoàn Thành Bài Thi!</h3>
        <p class="text-xs text-gray-500 mt-1">Kết quả của bạn đã được ghi nhận thành công.</p>
      </div>
      <div class="bg-gray-50 dark:bg-zinc-800 p-4 rounded-xl grid grid-cols-2 gap-2 sm:gap-4">
        <div>
          <span class="block text-[10px] sm:text-xs font-bold text-gray-400 uppercase">Điểm Số</span>
          <span id="finalScore" class="text-xl sm:text-2xl font-black text-[#cf1717]">0/0</span>
        </div>
        <div>
          <span class="block text-[10px] sm:text-xs font-bold text-gray-400 uppercase">Thời Gian Làm</span>
          <span id="finalTime" class="text-xl sm:text-2xl font-black text-gray-700 dark:text-gray-200">00:00</span>
        </div>
        <div class="space-y-2.5">
      <button onclick="closeResultModal()" class="w-full py-3 bg-gray-100 hover:bg-gray-200 dark:bg-zinc-800 dark:hover:bg-zinc-700 text-gray-800 dark:text-white font-bold text-xs rounded-xl transition flex items-center justify-center gap-1.5">
        <span>🔍</span>
        <span>Xem đáp án & giải thích chi tiết</span>
      </button>
      </div>
      <button onclick="window.location.href='dashboard.html'" class="w-full py-2.5 sm:py-3 bg-[#cf1717] hover:bg-red-700 text-white font-bold rounded-lg transition text-sm shadow">Trở Về Trang Chủ Dashboard</button>
    </div>
  </div>

<script>
    const SUPABASE_URL = "https://klovtvjfvfenhkvifujy.supabase.co";
    const SUPABASE_KEY = "sb_publishable_WevQJCkdgfwbgnUoNu1SfA_Ec9hT49-";
    const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentExam = null;
    let currentUser = null;
    let timerInterval = null;
    let timeSpentSeconds = 0;

    async function initExam() {
      const { data: { user } } = await sbClient.auth.getUser();
      if (!user) { window.location.href = 'index.html'; return; }
      currentUser = user;

      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      if (!token) { window.location.href = 'dashboard.html'; return; }

      const { data: exam } = await sbClient.from('exams').select('*').eq('token', token).single();
      if (!exam) { window.location.href = 'dashboard.html'; return; }

      currentExam = exam;
      renderExamData();
      startTimer(exam.time_limit || 60);
    }

    function renderExamData() {
      const headerTitle = document.getElementById('examHeaderTitle');
      if (headerTitle) headerTitle.innerText = currentExam.title || '';

      const topicTag = document.getElementById('examTopicTag');
      if (topicTag) topicTag.innerText = currentExam.topic || 'General';

      const passageBox = document.getElementById('passageContent');
      if (passageBox) passageBox.innerHTML = currentExam.passage_html || '<p>Không có nội dung bài đọc.</p>';

      const questions = currentExam.questions || [];
      const countTag = document.getElementById('questionCountTag');
      if (countTag) countTag.innerText = `${questions.length} câu hỏi`;

      // Hỗ trợ tìm cả 2 ID questionsForm hoặc questionsContainer
      const form = document.getElementById('questionsForm') || document.getElementById('questionsContainer');
      if (!form) return;

      form.innerHTML = questions.map((q, idx) => {
        const qNum = idx + 1;
        if (q.options && Array.isArray(q.options) && q.options.length > 0) {
          return `
            <div class="p-3 sm:p-4 rounded-xl border border-gray-100 dark:border-zinc-800 bg-gray-50/50 dark:bg-zinc-800/40 space-y-2 sm:space-y-3">
              <p class="font-bold text-xs sm:text-sm text-gray-900 dark:text-white">Câu ${qNum}: ${q.question}</p>
              <div class="space-y-1.5 sm:space-y-2">
                ${q.options.map(opt => `
                  <label class="flex items-center gap-2 sm:gap-3 text-xs sm:text-sm p-2 sm:p-2.5 rounded-lg border border-gray-200 dark:border-zinc-700 hover:bg-white dark:hover:bg-zinc-800 cursor-pointer transition">
                    <input type="radio" name="q_idx_${idx}" value="${opt}" class="accent-[#cf1717]">
                    <span>${opt}</span>
                  </label>
                `).join('')}
              </div>
            </div>`;
        } else {
          return `
            <div class="p-3 sm:p-4 rounded-xl border border-gray-100 dark:border-zinc-800 bg-gray-50/50 dark:bg-zinc-800/40 space-y-2 sm:space-y-3">
              <p class="font-bold text-xs sm:text-sm text-gray-900 dark:text-white">Câu ${qNum}: ${q.question}</p>
              <input type="text" name="q_idx_${idx}" placeholder="Nhập câu trả lời..." class="w-full p-2 sm:p-2.5 text-xs sm:text-sm rounded-lg border dark:bg-zinc-800 dark:border-zinc-700 focus:outline-none focus:ring-2 focus:ring-[#cf1717]">
            </div>`;
        }
      }).join('');
    }

async function submitExam() {
  clearInterval(timerInterval);
  const questions = currentExam.questions || [];
  let correctCount = 0;
  let userAnswers = {};

  // 1. Chấm điểm từng câu
  questions.forEach((q, idx) => {
    const radio = document.querySelector(`input[name="q_idx_${idx}"]:checked`);
    const textInput = document.querySelector(`input[name="q_idx_${idx}"][type="text"]`);
    
    let selectedVal = (radio ? radio.value : (textInput ? textInput.value : '')).trim();
    userAnswers[`câu_${idx + 1}`] = selectedVal;

    let userAns = selectedVal.toLowerCase();
    let correctAns = (q.answer || '').toString().trim().toLowerCase();

    let isCorrect = false;
    if (userAns && correctAns) {
      if (userAns === correctAns || userAns.startsWith(correctAns + '.') || userAns.startsWith(correctAns + ' ')) {
        isCorrect = true;
        correctCount++;
      }
    }

    // Đính kèm kết quả trực tiếp vào mảng câu hỏi để render giao diện
    q.userSelected = selectedVal;
    q.isCorrect = isCorrect;
  });

  // 2. Tính điểm thang 10 (Làm tròn 2 chữ số thập phân)
  const totalQuestions = questions.length;
  const score10 = totalQuestions > 0 ? Number(((10 / totalQuestions) * correctCount).toFixed(2)) : 0;

  // 3. Gửi điểm lên Supabase
  const payload = {
    exam_id: currentExam.id,
    user_id: currentUser.id,
    score: score10,
    answers: userAnswers
  };

  const { data, error } = await sbClient.from('exam_results').insert([payload]);

  if (error) {
    alert("❌ Lỗi lưu kết quả: " + error.message);
    return;
  }

  // 4. Render trạng thái Đúng/Sai & Giải thích chi tiết phía sau màn hình
  renderResultMode(questions);

  // 5. Hiển thị kết quả chi tiết lên Pop-up Modal (đã bổ sung kiểm tra an toàn)
  const scoreElem = document.getElementById('finalScore');
  if (scoreElem) scoreElem.innerText = `${score10}/10 điểm (${correctCount}/${totalQuestions} câu đúng)`;
  
  const timeElem = document.getElementById('finalTime');
  if (timeElem) timeElem.innerText = `${Math.floor(timeSpentSeconds / 60)}m ${timeSpentSeconds % 60}s`;
  
  const resultModal = document.getElementById('resultModal');
  if (resultModal) resultModal.classList.remove('hidden');
}

function closeResultModal() {
  const resultModal = document.getElementById('resultModal');
  if (resultModal) resultModal.classList.add('hidden');
}

// Hàm hiển thị Giao diện Đúng/Sai + Giải thích chi tiết
function renderResultMode(questions) {
  // SỬA LỖI: Tìm linh hoạt cả questionsForm và questionsContainer
  const questionBox = document.getElementById('questionsForm') || document.getElementById('questionsContainer'); 
  if (!questionBox) return;

  questionBox.innerHTML = questions.map((q, idx) => {
    const isCorrect = q.isCorrect;
    const userVal = q.userSelected || 'Chưa trả lời';

    return `
      <div class="p-4 sm:p-5 rounded-2xl border ${isCorrect ? 'bg-green-50/50 border-green-200 dark:bg-green-950/20 dark:border-green-900' : 'bg-red-50/50 border-red-200 dark:bg-red-950/20 dark:border-red-900'} space-y-3 mb-4">
        
        <!-- Tiêu đề câu hỏi + Badge Đúng/Sai -->
        <div class="flex justify-between items-start gap-2">
          <h4 class="font-bold text-sm text-gray-900 dark:text-white">Câu ${idx + 1}: ${q.question || q.title || ''}</h4>
          <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${isCorrect ? 'bg-green-100 text-green-700 dark:bg-green-900 dark:text-green-300' : 'bg-red-100 text-red-700 dark:bg-red-900 dark:text-red-300'}">
            ${isCorrect ? '✓ Đúng' : '✕ Sai'}
          </span>
        </div>

        <!-- Hiển thị các lựa chọn (Trắc nghiệm hoặc Tự luận) -->
        <div class="space-y-1.5 text-xs">
          ${q.options && Array.isArray(q.options) && q.options.length > 0 ? q.options.map(opt => {
            const optKey = opt.trim().charAt(0).toLowerCase();
            const correctKey = (q.answer || '').toString().trim().charAt(0).toLowerCase();
            const userKey = (q.userSelected || '').trim().charAt(0).toLowerCase();

            let style = "text-gray-600 dark:text-gray-400 p-1.5 rounded-lg";

            if (optKey === correctKey) {
              style = "font-bold text-green-700 dark:text-green-300 bg-green-100 dark:bg-green-900/50 p-1.5 rounded-lg";
            } else if (optKey === userKey && !isCorrect) {
              style = "font-bold text-red-700 dark:text-red-300 bg-red-100 dark:bg-red-900/50 p-1.5 rounded-lg line-through";
            }

            return `<div class="${style}">${opt}</div>`;
          }).join('') : `
            <div class="p-2.5 bg-white dark:bg-zinc-800 rounded-xl border border-gray-100 dark:border-zinc-700 space-y-1">
              <div><span class="text-gray-400">Bạn nhập:</span> <strong class="${isCorrect ? 'text-green-600 dark:text-green-400' : 'text-red-600 dark:text-red-400'}">${userVal}</strong></div>
              <div><span class="text-gray-400">Đáp án chuẩn:</span> <strong class="text-green-600 dark:text-green-400">${q.answer}</strong></div>
            </div>
          `}
        </div>

        <!-- Khung GIẢI THÍCH CHI TIẾT -->
        ${q.explanation ? `
          <div class="mt-3 pt-3 border-t border-gray-200/60 dark:border-zinc-700/60 text-xs">
            <div class="flex items-center gap-1 text-[#cf1717] dark:text-red-400 font-bold mb-1">
              <span>💡</span>
              <span>Giải thích chi tiết:</span>
            </div>
            <div class="text-gray-700 dark:text-gray-300 leading-relaxed bg-white dark:bg-zinc-800 p-3 rounded-xl border border-gray-100 dark:border-zinc-700">
              ${q.explanation}
            </div>
          </div>
        ` : ''}

      </div>
    `;
  }).join('');
}
    
    // CHUYỂN TAB TRÊN MÀN HÌNH ĐIỆN THOẠI
    function switchMobileTab(tab) {
      const reading = document.getElementById('readingSection');
      const questions = document.getElementById('questionsSection');
      const btnR = document.getElementById('mobileTabReading');
      const btnQ = document.getElementById('mobileTabQuestions');

      if (!reading || !questions || !btnR || !btnQ) return;

      if (tab === 'reading') {
        reading.classList.remove('hidden');
        questions.classList.add('hidden');
        btnR.className = "w-1/2 py-2.5 text-center font-bold text-xs text-[#cf1717] border-b-2 border-[#cf1717]";
        btnQ.className = "w-1/2 py-2.5 text-center font-bold text-xs text-gray-400";
      } else {
        reading.classList.add('hidden');
        questions.classList.remove('hidden');
        questions.classList.add('block');
        btnQ.className = "w-1/2 py-2.5 text-center font-bold text-xs text-[#cf1717] border-b-2 border-[#cf1717]";
        btnR.className = "w-1/2 py-2.5 text-center font-bold text-xs text-gray-400";
      }
    }

    // TÍNH NĂNG HIGHLIGHT VĂN BẢN
    function highlightSelectedText() {
      const selection = window.getSelection();
      if (!selection.rangeCount || selection.isCollapsed) {
        alert("Vui lòng bôi đen một đoạn văn bản trong bài đọc trước khi bấm Highlight!");
        return;
      }
      const range = selection.getRangeAt(0);
      const mark = document.createElement('mark');
      mark.className = 'bg-yellow-300 dark:bg-yellow-500 text-black px-1 rounded';
      mark.appendChild(range.extractContents());
      range.insertNode(mark);
      selection.removeAllRanges();
    }

    function startTimer(minutes) {
      let remaining = minutes * 60;
      timerInterval = setInterval(() => {
        remaining--;
        timeSpentSeconds++;
        const m = Math.floor(remaining / 60).toString().padStart(2, '0');
        const s = (remaining % 60).toString().padStart(2, '0');
        const timerElem = document.getElementById('timerDisplay') || document.getElementById('timer');
        if (timerElem) timerElem.innerText = `${m}:${s}`;
        if (remaining <= 0) {
          clearInterval(timerInterval);
          submitExam();
        }
      }, 1000);
    }

    function confirmSubmitExam() {
      if (confirm("Bạn có chắc chắn muốn nộp bài thi?")) submitExam();
    }

    function toggleDarkMode() {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.theme = 'light';
      } else {
        document.documentElement.classList.add('dark');
        localStorage.theme = 'dark';
      }
    }

    window.onload = initExam;
  </script>
</body>
</html>
