<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IELTS Master - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>// BẮT BUỘC: Bảo Tailwind lắng nghe class "dark" ở thẻ <html> 
    tailwind.config = {
    darkMode: 'class'}
</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <link rel="icon" type="image/png" href="https://i.ibb.co/G4bb6CM1/READ.png">
</head>
<body class="bg-gray-50 dark:bg-zinc-950 dark:text-gray-100 min-h-screen transition-colors duration-300">

  <!-- Header Navbar -->
  <header class="bg-white dark:bg-zinc-900 border-b dark:border-zinc-800 sticky top-0 z-40 shadow-sm px-4">
    <div class="max-w-7xl mx-auto px-2 sm:px-6 lg:px-8 h-16 flex justify-between items-center">
      <div class="flex items-center gap-2 sm:gap-3">
        <div class="w-12 h-12 rounded-xl bg-[#cf1717] flex items-center justify-center overflow-hidden"><img src="https://i.ibb.co/G4bb6CM1/READ.png" alt="ReadUp Logo" class="h-9 w-auto object-contain"></div>
        <span class="font-extrabold text-lg sm:text-xl text-[#cf1717] tracking-wide">READUP ENGLISH</span>
      </div>

      <div class="flex items-center gap-2 sm:gap-3">
        <span id="welcomeUser" class="text-xs sm:text-sm font-semibold text-gray-700 dark:text-gray-200 hidden sm:inline">👋 Chào mừng sinh viên</span>
        <button onclick="togglePasswordModal(true)" class="px-2.5 sm:px-3 py-1.5 text-xs font-bold border border-[#cf1717] text-[#cf1717] hover:bg-[#cf1717] hover:text-white rounded-lg transition">🔒 Đổi mật khẩu</button>
        <button onclick="handleLogout()" class="px-2.5 sm:px-3 py-1.5 text-xs font-bold bg-gray-200 dark:bg-zinc-800 hover:bg-red-100 text-gray-700 dark:text-gray-300 hover:text-[#cf1717] rounded-lg transition">Đăng xuất</button>
        <button onclick="toggleDarkMode()" class="p-2 rounded-full bg-gray-100 dark:bg-zinc-800 text-sm">🌙 / ☀️</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 space-y-8 sm:space-y-10">

    <!-- PHẦN 1: TIN TỨC & THÔNG BÁO -->
    <section class="space-y-3 sm:space-y-4">
      <div class="flex items-center gap-2 border-l-4 border-[#cf1717] pl-3">
        <h2 class="text-lg sm:text-xl font-extrabold text-gray-900 dark:text-white">📰 Tin Tức & Thông Báo Mới</h2>
      </div>
      <div id="newsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
        <p class="text-gray-500 text-xs sm:text-sm col-span-full">⏳ Đang tải thông báo...</p>
      </div>
    </section>

    <!-- PHẦN 2: DANH SÁCH BÀI THI READING -->
    <section class="space-y-3 sm:space-y-4">
      <div class="flex items-center justify-between border-l-4 border-[#cf1717] pl-3">
        <h2 class="text-lg sm:text-xl font-extrabold text-gray-900 dark:text-white">📚 Danh Sách Bài Thi Reading</h2>
        <span id="examCount" class="text-xs font-bold px-2.5 py-1 bg-red-100 dark:bg-red-950 text-[#cf1717] rounded-full">0 bài làm</span>
      </div>
      <div id="examsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
        <p class="text-gray-500 text-xs sm:text-sm col-span-full">⏳ Đang tải bài thi...</p>
      </div>
    </section>

    <!-- PHẦN 3: LỊCH SỬ VÀ KẾT QUẢ BÀI LÀM CỦA HỌC SINH -->
    <section class="space-y-3 sm:space-y-4">
      <div class="flex items-center border-l-4 border-[#cf1717] pl-3">
        <h2 class="text-lg sm:text-xl font-extrabold text-gray-900 dark:text-white">📜 Lịch Sử & Kết Quả Bài Làm</h2>
      </div>
  <!-- Dữ liệu sẽ được tự động đổ vào thẻ div này -->
      <div class="mt-8 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
  <div id="historyList">
    <p class="text-gray-400 text-sm">Đang tải dữ liệu...</p>
  </div>
      </div>
</div>
    </section>

  </main>

  <!-- MODAL ĐỔI MẬT KHẨU -->
  <div id="passwordModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white dark:bg-zinc-900 border dark:border-zinc-800 rounded-2xl p-6 w-full max-w-md shadow-2xl space-y-4">
      <h3 class="text-xl font-bold text-[#cf1717]">Đổi Mật Khẩu Tài Khoản</h3>
      <form onsubmit="handleChangePassword(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase mb-1">Mật khẩu mới</label>
          <input type="password" id="newPassword" required minlength="6" placeholder="Mật khẩu mới (tối thiểu 6 ký tự)" class="w-full p-3 rounded-lg border dark:bg-zinc-800 dark:border-zinc-700">
        </div>
        <div class="flex gap-3 pt-2">
          <button type="button" onclick="togglePasswordModal(false)" class="w-1/2 py-2.5 bg-gray-200 dark:bg-zinc-700 font-bold rounded-lg text-sm">Hủy</button>
          <button type="submit" class="w-1/2 py-2.5 bg-[#cf1717] hover:bg-red-700 text-white font-bold rounded-lg transition text-sm">Cập nhật</button>
        </div>
      </form>
      <p id="pwdMsg" class="text-center text-xs font-semibold"></p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://klovtvjfvfenhkvifujy.supabase.co";
    const SUPABASE_KEY = "sb_publishable_WevQJCkdgfwbgnUoNu1SfA_Ec9hT49-";
    const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;

    async function initDashboard() {
      const { data: { user } } = await sbClient.auth.getUser();
      if (!user) {
        window.location.href = 'index.html';
        return;
      }
      currentUser = user;
      

      const { data: profile } = await sbClient.from('profiles').select('full_name').eq('id', user.id).single();
      if (profile?.full_name) {
        document.getElementById('welcomeUser').innerText = `👋 Chào, ${profile.full_name}`;
      }

      loadNews();
      loadExams();
      loadStudentHistory();
    }

    async function loadNews() {
      const newsBox = document.getElementById('newsContainer');
      const { data: newsList } = await sbClient.from('news').select('*').order('created_at', { ascending: false });

      if (!newsList || newsList.length === 0) {
        newsBox.innerHTML = `<div class="col-span-full bg-white dark:bg-zinc-900 border dark:border-zinc-800 rounded-xl p-6 text-center text-gray-400 text-xs sm:text-sm">Chưa có thông báo nào.</div>`;
        return;
      }

      newsBox.innerHTML = newsList.map(item => `
        <div class="bg-white dark:bg-zinc-900 border dark:border-zinc-800 rounded-2xl overflow-hidden shadow-sm flex flex-col justify-between p-4 sm:p-5 space-y-3">
          ${item.image_url ? `<img src="${item.image_url}" class="h-32 sm:h-44 w-full object-cover rounded-lg sm:rounded-xl">` : ''}
          <div class="flex-1 flex flex-col justify-between space-y-2">
            <div>
              <span class="text-[10px] font-bold uppercase text-[#cf1717] bg-red-50 dark:bg-red-950 px-2 py-0.5 rounded">${new Date(item.created_at).toLocaleDateString('vi-VN')}</span>
              <h3 class="font-bold text-sm sm:text-base text-gray-900 dark:text-white mt-1">${item.title}</h3>
              <p class="text-xs text-gray-600 dark:text-gray-400 mt-2 leading-relaxed line-clamp-3">${item.content}</p>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function loadExams() {
      const examBox = document.getElementById('examsContainer');
      const { data: examList } = await sbClient.from('exams').select('*').order('created_at', { ascending: false });

      if (!examList || examList.length === 0) {
        examBox.innerHTML = `<div class="col-span-full bg-white dark:bg-zinc-900 border dark:border-zinc-800 rounded-xl p-6 text-center text-gray-400 text-xs sm:text-sm">Chưa có bài thi nào.</div>`;
        const countElem = document.getElementById('examCount');
        if (countElem) countElem.innerText = '0 bài làm';
        return;
      }

      const countElem = document.getElementById('examCount');
      if (countElem) countElem.innerText = `${examList.length} bài làm`;

      examBox.innerHTML = examList.map(exam => `
        <div class="bg-white dark:bg-zinc-900 border dark:border-zinc-800 rounded-2xl p-4 sm:p-5 shadow-sm space-y-4 flex flex-col justify-between">
          <div class="space-y-2">
            <div class="flex justify-between items-center">
              <span class="text-xs font-bold text-[#cf1717] bg-red-50 dark:bg-red-950/80 px-2.5 py-1 rounded-full">📌 ${exam.topic || 'General'}</span>
              <span class="text-xs text-gray-400">⏱️ ${exam.time_limit || 60} phút</span>
            </div>
            <h3 class="font-bold text-base sm:text-lg text-gray-900 dark:text-white">${exam.title}</h3>
            <p class="text-xs text-gray-500 line-clamp-2">${exam.notes || 'Không có ghi chú'}</p>
          </div>
          <div class="pt-3 border-t border-gray-100 dark:border-zinc-800 flex justify-between items-center">
            <span class="text-[11px] text-gray-400">📅 ${new Date(exam.created_at).toLocaleDateString('vi-VN')}</span>
            <button onclick="window.location.href='exam.html?token=${exam.token}'" class="px-3 sm:px-4 py-2 bg-[#cf1717] hover:bg-red-700 text-white font-bold text-xs rounded-lg shadow transition">Vào làm bài ➔</button>
          </div>
        </div>
      `).join('');
    }

   async function loadStudentHistory() {
  const historyContainer = document.getElementById('historyList');
  if (!historyContainer) return;

  if (!currentUser) {
    historyContainer.innerHTML = "<p class='text-red-500 text-sm'>Vui lòng đăng nhập để xem lịch sử.</p>";
    return;
  }

  // 1. Tải dữ liệu từ Supabase
  const { data: results, error } = await sbClient
    .from('exam_results')
    .select(`
      id,
      score,
      answers,
      submitted_at,
      exams ( title )
    `)
    .eq('user_id', currentUser.id)
    .order('submitted_at', { ascending: false });

  // 2. Xử lý khi lỗi hoặc không có dữ liệu
  if (error) {
    console.error("Lỗi lấy lịch sử:", error);
    historyContainer.innerHTML = "<p class='text-red-500 text-sm'>Không thể tải lịch sử làm bài.</p>";
    return;
  }

  if (!results || results.length === 0) {
    historyContainer.innerHTML = "<p class='text-gray-400 text-sm'>Bạn chưa thực hiện bài thi nào.</p>";
    return;
  }

  // 3. Render giao diện ra màn hình
  historyContainer.innerHTML = results.map(item => {
    const date = new Date(item.submitted_at).toLocaleString('vi-VN');
    const totalAns = item.answers ? Object.keys(item.answers).length : 0;
    const examTitle = item.exams?.title || 'Bài thi Tiếng Anh';

    return `
      <div class="p-4 bg-gray-50 hover:bg-gray-100 rounded-xl border border-gray-200 mb-3 flex justify-between items-center transition-all">
        <div>
          <h4 class="font-bold text-gray-800 text-base">${examTitle}</h4>
          <p class="text-xs text-gray-400 mt-1">🕒 Nộp lúc: ${date}</p>
        </div>
        <div class="text-right">
          <span class="text-lg font-extrabold text-red-600">${item.score} / 10 điểm</span>
          <p class="text-xs text-gray-500 font-medium">Số câu đã làm: ${totalAns}</p>
        </div>
      </div>
    `;
  }).join('');
}

    function toggleDarkMode() {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.theme = 'light';
      } else {
        document.documentElement.classList.add('dark');
        localStorage.theme = 'dark';
      }
    }

    function togglePasswordModal(show) {
      document.getElementById('passwordModal').classList.toggle('hidden', !show);
    }

    async function handleChangePassword(e) {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const msg = document.getElementById('pwdMsg');
      msg.innerText = "⏳ Đang cập nhật...";
      const { error } = await sbClient.auth.updateUser({ password: newPassword });
      if (error) {
        msg.innerText = "❌ " + error.message;
        msg.className = "text-center text-xs font-semibold text-red-500";
      } else {
        msg.innerText = "✅ Cập nhật mật khẩu thành công!";
        msg.className = "text-center text-xs font-semibold text-green-600";
        setTimeout(() => togglePasswordModal(false), 1500);
      }
    }

    async function handleLogout() {
      await sbClient.auth.signOut();
      window.location.href = 'index.html';
    }

    window.onload = initDashboard;
  </script>
</body>
</html>
