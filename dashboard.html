<!-- Nút mở Modal Đổi Mật Khẩu trong Dashboard Header -->
<button onclick="togglePasswordModal(true)" class="px-4 py-2 border border-[#cf1717] text-[#cf1717] hover:bg-[#cf1717] hover:text-white rounded-lg text-sm font-bold transition">
  🔒 Đổi mật khẩu
</button>

<!-- Modal Đổi Mật Khẩu -->
<div id="passwordModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
  <div class="bg-white dark:bg-zinc-900 border dark:border-zinc-800 rounded-2xl p-6 w-full max-w-md shadow-2xl">
    <h3 class="text-xl font-bold text-[#cf1717] mb-4">Đổi Mật Khẩu Mới</h3>
    
    <form onsubmit="handleChangePassword(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold uppercase mb-1">Mật khẩu mới</label>
        <input type="password" id="newPassword" required minlength="6" placeholder="Ít nhất 6 ký tự" class="w-full p-3 rounded-lg border dark:bg-zinc-800 dark:border-zinc-700">
      </div>

      <div class="flex gap-3 pt-2">
        <button type="button" onclick="togglePasswordModal(false)" class="w-1/2 py-2.5 bg-gray-200 dark:bg-zinc-700 font-bold rounded-lg">
          Hủy
        </button>
        <button type="submit" class="w-1/2 py-2.5 bg-[#cf1717] hover:bg-red-700 text-white font-bold rounded-lg transition">
          Cập nhật
        </button>
      </div>
    </form>
    
    <p id="pwdMsg" class="mt-3 text-center text-xs font-semibold"></p>
  </div>
</div>

<script>
  function togglePasswordModal(show) {
    document.getElementById('passwordModal').classList.toggle('hidden', !show);
  }

  async function handleChangePassword(e) {
    e.preventDefault();
    const newPassword = document.getElementById('newPassword').value;
    const msg = document.getElementById('pwdMsg');

    msg.innerText = "Đang cập nhật...";
    msg.className = "mt-3 text-center text-xs font-semibold text-gray-500";

    const { error } = await supabase.auth.updateUser({ password: newPassword });

    if (error) {
      msg.innerText = "Lỗi: " + error.message;
      msg.className = "mt-3 text-center text-xs font-semibold text-red-500";
    } else {
      msg.innerText = "Cập nhật mật khẩu thành công!";
      msg.className = "mt-3 text-center text-xs font-semibold text-green-500";
      setTimeout(() => togglePasswordModal(false), 1500);
    }
  }
</script>
