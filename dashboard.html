<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IELTS Master - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
</head>
<body class="bg-gray-50 dark:bg-zinc-950 dark:text-gray-100 min-h-screen transition-colors duration-300">

  <!-- Header Navbar -->
  <header class="bg-white dark:bg-zinc-900 border-b dark:border-zinc-800 sticky top-0 z-40 shadow-sm px-4">
    <div class="max-w-7xl mx-auto h-16 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-[#cf1717] flex items-center justify-center text-white font-bold text-sm">📖</div>
        <span class="font-extrabold text-lg text-[#cf1717] tracking-wide">IELTS MASTER</span>
      </div>

      <div class="flex items-center gap-2">
        <span id="welcomeUser" class="text-xs font-semibold text-gray-700 dark:text-gray-200 hidden sm:inline">👋 Chào bạn</span>
        <button onclick="handleLogout()" class="px-2.5 py-1.5 text-xs font-bold bg-gray-200 dark:bg-zinc-800 hover:bg-red-100 text-gray-700 dark:text-gray-300 hover:text-[#cf1717] rounded-lg transition">Đăng xuất</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 space-y-8">

    <!-- TIN TỨC -->
    <section class="space-y-3">
      <h2 class="text-lg font-extrabold text-gray-900 dark:text-white border-l-4 border-[#cf1717] pl-3">📰 Tin Tức & Thông Báo</h2>
      <div id="newsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <p class="text-gray-500 text-xs">⏳ Đang tải thông báo...</p>
      </div>
    </section>

    <!-- DANH SÁCH BÀI THI -->
    <section class="space-y-3">
      <h2 class="text-lg font-extrabold text-gray-900 dark:text-white border-l-4 border-[#cf1717] pl-3">📚 Bài Thi Reading</h2>
      <div id="examsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <p class="text-gray-500 text-xs">⏳ Đang tải bài thi...</p>
      </div>
    </section>

    <!-- LỊCH SỬ BÀI LÀM -->
    <section class="space-y-3">
      <h2 class="text-lg font-extrabold text-gray-900 dark:text-white border-l-4 border-[#cf1717] pl-3">📜 Kết Quả Đã Làm</h2>
      <div class="bg-white dark:bg-zinc-900 border dark:border-zinc-800 rounded-2xl shadow-sm overflow-x-auto">
        <table class="w-full text-left text-xs sm:text-sm">
          <thead class="bg-gray-100 dark:bg-zinc-800 text-gray-600 dark:text-gray-300 uppercase text-[10px]">
            <tr>
              <th class="p-3">Tên bài thi</th>
              <th class="p-3">Điểm</th>
              <th class="p-3">Thời gian</th>
              <th class="p-3">Ngày nộp</th>
            </tr>
          </thead>
          <tbody id="studentHistoryBody" class="divide-y divide-gray-100 dark:divide-zinc-800">
            <tr><td colspan="4" class="p-3 text-center text-gray-400">Đang tải lịch sử...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    const SUPABASE_URL = "https://klovtvjfvfenhkvifujy.supabase.co";
    const SUPABASE_KEY = "sb_publishable_WevQJCkdgfwbgnUoNu1SfA_Ec9hT49-";
    const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;

    async function initDashboard() {
      const { data: { user } } = await sbClient.auth.getUser();
      if (!user) { window.location.href = 'index.html'; return; }
      currentUser = user;

      const { data: profile } = await sbClient.from('profiles').select('full_name').eq('id', user.id).single();
      if (profile?.full_name) {
        document.getElementById('welcomeUser').innerText = `👋 Chào, ${profile.full_name}`;
      }

      loadNews();
      loadExams();
      loadStudentHistory();
    }

    async function loadNews() {
      const newsBox = document.getElementById('newsContainer');
      const { data: newsList } = await sbClient.from('news').select('*').order('created_at', { ascending: false });

      if (!newsList || newsList.length === 0) {
        newsBox.innerHTML = `<p class="text-gray-400 text-xs">Chưa có thông báo.</p>`;
        return;
      }

      newsBox.innerHTML = newsList.map(item => `
        <div class="bg-white dark:bg-zinc-900 border dark:border-zinc-800 rounded-xl p-4 shadow-sm space-y-2">
          ${item.image_url ? `<img src="${item.image_url}" class="h-32 w-full object-cover rounded-lg">` : ''}
          <h3 class="font-bold text-sm text-gray-900 dark:text-white">${item.title}</h3>
          <p class="text-xs text-gray-500 line-clamp-3">${item.content}</p>
        </div>
      `).join('');
    }

    async function loadExams() {
      const examBox = document.getElementById('examsContainer');
      const { data: examList } = await sbClient.from('exams').select('*').order('created_at', { ascending: false });

      if (!examList || examList.length === 0) {
        examBox.innerHTML = `<p class="text-gray-400 text-xs">Chưa có bài thi.</p>`;
        return;
      }

      examBox.innerHTML = examList.map(exam => `
        <div class="bg-white dark:bg-zinc-900 border dark:border-zinc-800 rounded-xl p-4 shadow-sm flex flex-col justify-between space-y-3">
          <div>
            <span class="text-[10px] font-bold text-[#cf1717] bg-red-50 dark:bg-red-950 px-2 py-0.5 rounded-full">${exam.topic}</span>
            <h3 class="font-bold text-base text-gray-900 dark:text-white mt-1">${exam.title}</h3>
          </div>
          <button onclick="window.location.href='exam.html?token=${exam.token}'" class="w-full py-2 bg-[#cf1717] hover:bg-red-700 text-white font-bold text-xs rounded-lg transition shadow">Vào Làm Bài ➔</button>
        </div>
      `).join('');
    }

    async function loadStudentHistory() {
      const tbody = document.getElementById('studentHistoryBody');
      const { data: history } = await sbClient
        .from('exam_results')
        .select('*, exams(title)')
        .eq('user_id', currentUser.id)
        .order('submitted_at', { ascending: false });

      if (!history || history.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-3 text-center text-gray-400">Bạn chưa làm bài thi nào.</td></tr>`;
        return;
      }

      tbody.innerHTML = history.map(h => `
        <tr>
          <td class="p-3 font-bold text-gray-900 dark:text-white">${h.exams?.title || 'Bài thi Reading'}</td>
          <td class="p-3 font-extrabold text-[#cf1717]">${h.score} điểm</td>
          <td class="p-3 text-xs text-gray-500">${Math.floor(h.time_spent / 60)}m ${h.time_spent % 60}s</td>
          <td class="p-3 text-xs text-gray-400">${new Date(h.submitted_at).toLocaleDateString('vi-VN')}</td>
        </tr>
      `).join('');
    }

    async function handleLogout() {
      await sbClient.auth.signOut();
      window.location.href = 'index.html';
    }

    window.onload = initDashboard;
  </script>
</body>
</html>
