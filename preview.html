<!DOCTYPE html>
<html lang="vi" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trình xem trước (Preview Mode)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/compiled/preview.css">
  <link rel="stylesheet" href="assets/css/ru-refined.css">
</head>
<body class="bg-gray-100 dark:bg-zinc-900 min-h-screen p-4 sm:p-6">
<!-- Màn hình chờ: kiểm tra phiên trước khi hiển thị giao diện -->
<div id="ru-page-loader" class="ru-page-loader" role="status" aria-live="polite" aria-label="Đang kiểm tra phiên đăng nhập">
  <div class="ru-page-loader__center">
    <div class="ru-page-loader__brand">
      <img src="https://i.ibb.co/9m1LMnz3/Xanh-Tr-ng-n-Gi-n-Bi-u-T-ng-Logo-1.png" alt="ReadUp English Logo" width="64" height="64">
      <div class="ru-page-loader__name"><strong>ReadUp</strong><span>English</span></div>
    </div>
    <div class="ru-page-loader__track" aria-hidden="true"><span class="ru-page-loader__bar"></span></div>
    <span class="ru-page-loader__sr">Đang kiểm tra phiên đăng nhập...</span>
  </div>
</div>


  <!-- Thanh cảnh báo Xem thử -->
  <div class="max-w-4xl mx-auto mb-4 bg-amber-500 text-white font-bold text-center py-2 px-4 rounded-xl shadow-md flex justify-between items-center text-xs sm:text-sm">
    <span>⚠️ CHẾ ĐỘ XEM THỬ (Chưa lưu vào cơ sở dữ liệu)</span>
    <button onclick="window.close()" class="bg-black/20 hover:bg-black/40 px-3 py-1 rounded-lg">Đóng</button>
  </div>

  <!-- Vùng chứa nội dung sẽ render -->
  <div id="previewContainer" class="max-w-4xl mx-auto bg-white dark:bg-zinc-800 p-6 rounded-2xl shadow-lg"></div>

  
<script src="assets/compiled/preview.part1.js"></script>
  <script src="assets/js/ru-navigation.js"></script>
</body>
</html>
