<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Đăng Nhập | Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: '#cf1717',
                            hover: '#b01212',
                            light: '#ffebee',
                            dark: '#8b0f0f'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Background Gradients */
        .bg-gradient-light {
            background: radial-gradient(circle at top right, #fff5f5 0%, #ffffff 50%, #f8fafc 100%);
        }
        .bg-gradient-dark {
            background: radial-gradient(circle at top right, #1a0808 0%, #0f172a 60%, #020617 100%);
        }
        /* Custom Glassmorphism */
        .glass-card {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
    </style>
</head>
<body class="font-sans antialiased bg-gradient-light dark:bg-gradient-dark text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-300 flex flex-col justify-between">

    <!-- Header / Top Bar (Dark-Light Toggle & Logo) -->
    <header class="w-full max-w-7xl mx-auto p-4 flex justify-between items-center">
        <!-- Logo -->
        <div class="flex items-center gap-3">
            <img src="https://ibb.co/Zz0KkyYf" alt="Logo" class="h-10 w-auto object-contain drop-shadow-md" onerror="this.onerror=null; this.src='https://via.placeholder.com/150x50?text=LOGO';">
            <span class="font-bold text-xl tracking-tight hidden sm:inline text-slate-900 dark:text-white">
                LEARNING<span class="text-[#cf1717]">PORTAL</span>
            </span>
        </div>

        <!-- Dark/Light Mode Toggle Button -->
        <button id="theme-toggle" class="p-2.5 rounded-full bg-white/80 dark:bg-slate-800/80 shadow-md border border-slate-200 dark:border-slate-700 hover:scale-105 active:scale-95 transition-all text-slate-700 dark:text-amber-400">
            <i id="theme-toggle-dark-icon" class="fa-solid fa-moon text-lg hidden"></i>
            <i id="theme-toggle-light-icon" class="fa-solid fa-sun text-lg hidden"></i>
        </button>
    </header>

    <!-- Main Content / Login Card -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-md">
            
            <!-- Login Container Card -->
            <div class="glass-card bg-white/90 dark:bg-slate-900/85 border border-slate-200/80 dark:border-slate-800 rounded-3xl p-8 shadow-2xl shadow-red-950/5 dark:shadow-black/50 transition-all">
                
                <!-- Card Header -->
                <div class="text-center mb-8">
                    <div class="inline-flex p-3 rounded-2xl bg-red-50 dark:bg-red-950/30 text-[#cf1717] mb-3">
                        <i class="fa-solid fa-[#cf1717] fa-user-shield text-2xl"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Chào mừng trở lại!</h1>
                    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Đăng nhập để truy cập kho bài đọc và tài liệu</p>
                </div>

                <!-- Auth Form -->
                <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
                    
                    <!-- Username/Email Input -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-2">Tên tài khoản / Email</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                                <i class="fa-regular fa-envelope"></i>
                            </span>
                            <input type="text" id="username" required placeholder="nhap_tai_khoan" 
                                class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-[#cf1717] focus:border-transparent transition-all text-sm">
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300">Mật khẩu</label>
                            <a href="#" class="text-xs font-medium text-[#cf1717] hover:underline">Quên mật khẩu?</a>
                        </div>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                                <i class="fa-solid fa-lock"></i>
                            </span>
                            <input type="password" id="password" required placeholder="••••••••" 
                                class="w-full pl-10 pr-10 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-[#cf1717] focus:border-transparent transition-all text-sm">
                            <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                                <i id="eye-icon" class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Remember Me & Role Indicator -->
                    <div class="flex items-center justify-between text-xs text-slate-600 dark:text-slate-400">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" class="rounded border-slate-300 text-[#cf1717] focus:ring-[#cf1717]">
                            <span>Ghi nhớ đăng nhập</span>
                        </label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" 
                        class="w-full py-3.5 px-4 bg-[#cf1717] hover:bg-[#b01212] active:scale-[0.99] text-white font-semibold rounded-xl shadow-lg shadow-red-600/25 transition-all flex items-center justify-center gap-2 group">
                        <span>Đăng nhập hệ thống</span>
                        <i class="fa-solid fa-arrow-right text-xs group-hover:translate-x-1 transition-transform"></i>
                    </button>
                </form>

                <!-- Footer Text -->
                <div class="mt-8 pt-6 border-t border-slate-100 dark:border-slate-800 text-center text-xs text-slate-500 dark:text-slate-400">
                    Bạn chưa có tài khoản? <a href="#" class="font-semibold text-[#cf1717] hover:underline">Đăng ký ngay</a>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full text-center py-4 text-xs text-slate-400 dark:text-slate-500">
        &copy; 2026 Learning Portal. All rights reserved. Tông màu chủ đạo: <span class="font-mono text-[#cf1717]">#cf1717</span>
    </footer>

    <!-- JavaScript Handling Dark Mode & Auth Flow -->
    <script>
        // --- 1. DARK / LIGHT MODE CONTROLLER ---
        const themeToggleBtn = document.getElementById('theme-toggle');
        const darkIcon = document.getElementById('theme-toggle-dark-icon');
        const lightIcon = document.getElementById('theme-toggle-light-icon');

        // Check initial theme preference
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            lightIcon.classList.remove('hidden');
        } else {
            document.documentElement.classList.remove('dark');
            darkIcon.classList.remove('hidden');
        }

        // Toggle Event Listener
        themeToggleBtn.addEventListener('click', function() {
            darkIcon.classList.toggle('hidden');
            lightIcon.classList.toggle('hidden');

            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            }
        });

        // --- 2. PASSWORD VISIBILITY TOGGLE ---
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        // --- 3. HANDLE LOGIN DEMO & ROUTING TOKEN ---
        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            
            // Giả lập lưu phiên đăng nhập
            localStorage.setItem('user_session', JSON.stringify({
                user: username,
                role: username.toLowerCase().includes('admin') ? 'admin' : 'user',
                token: 'tok_' + Math.random().toString(36).substring(2, 10)
            }));

            alert('Đăng nhập thành công với tài khoản: ' + username);
            // Sẵn sàng để chuyển sang Bước 2 (Giao diện bài đọc/Admin)
        }
    </script>
</body>
</html>
