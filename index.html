<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IELTS Reading - Đăng nhập / Đăng ký</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gradient-to-br from-red-50 via-white to-gray-100 dark:bg-zinc-950 dark:text-white min-h-screen transition-colors duration-300">
  
  <header class="flex justify-between items-center p-4 max-w-6xl mx-auto">
    <div class="flex items-center gap-2">
      <img src="https://ibb.co/Zz0KkyYf" alt="Logo" class="h-10">
      <span class="font-bold text-xl text-[#cf1717]">IELTS MASTER</span>
    </div>
    <button id="toggleThemeBtn" onclick="document.documentElement.classList.toggle('dark')" class="p-2 rounded-full bg-gray-200 dark:bg-zinc-800">🌙</button>
  </header>

  <main class="flex justify-center items-center py-8 px-4">
    <div class="w-full max-w-md bg-white dark:bg-zinc-900 rounded-2xl shadow-xl p-8 border border-gray-100 dark:border-zinc-800">
      
      <!-- Tab Switcher -->
      <div class="flex border-b border-gray-200 dark:border-zinc-700 mb-6">
        <button id="tabLogin" onclick="switchTab('login')" class="w-1/2 py-2 text-center font-bold text-[#cf1717] border-b-2 border-[#cf1717]">Đăng Nhập</button>
        <button id="tabRegister" onclick="switchTab('register')" class="w-1/2 py-2 text-center font-bold text-gray-400">Đăng Ký</button>
      </div>

      <!-- Form Auth -->
      <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
        
        <!-- Ô Họ và tên (Chỉ hiện khi Đăng ký) -->
        <div id="fullNameGroup" class="hidden">
          <label class="block text-xs font-bold uppercase mb-1">Họ và Tên</label>
          <input type="text" id="fullName" placeholder="Nguyễn Văn A" class="w-full p-3 rounded-lg border dark:bg-zinc-800 dark:border-zinc-700 focus:outline-none focus:ring-2 focus:ring-[#cf1717]">
        </div>

        <!-- Ô Ngày tháng năm sinh (Chỉ hiện khi Đăng ký) -->
        <div id="dobGroup" class="hidden">
          <label class="block text-xs font-bold uppercase mb-1">Ngày tháng năm sinh</label>
          <input type="date" id="dob" class="w-full p-3 rounded-lg border dark:bg-zinc-800 dark:border-zinc-700 focus:outline-none focus:ring-2 focus:ring-[#cf1717]">
        </div>

        <!-- Ô Email -->
        <div>
          <label class="block text-xs font-bold uppercase mb-1">Email</label>
          <input type="email" id="email" required placeholder="student@example.com" class="w-full p-3 rounded-lg border dark:bg-zinc-800 dark:border-zinc-700 focus:outline-none focus:ring-2 focus:ring-[#cf1717]">
        </div>

        <!-- Ô Mật khẩu -->
        <div>
          <label class="block text-xs font-bold uppercase mb-1">Mật khẩu</label>
          <input type="password" id="password" required placeholder="••••••••" class="w-full p-3 rounded-lg border dark:bg-zinc-800 dark:border-zinc-700 focus:outline-none focus:ring-2 focus:ring-[#cf1717]">
        </div>

        <!-- Nút submit -->
        <button type="submit" id="submitBtn" class="w-full py-3 bg-[#cf1717] hover:bg-red-700 text-white font-bold rounded-lg transition shadow-md">
          Đăng Nhập
        </button>

        <!-- Ghi chú bảo mật -->
        <div class="pt-2 text-center">
          <span class="text-xs text-gray-400 dark:text-gray-500 flex items-center justify-center gap-1 font-medium">
            🔒 Dữ liệu đã được bảo mật
          </span>
        </div>
      </form>

      <p id="authMsg" class="mt-4 text-center text-sm font-semibold"></p>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://klovtvjfvfenhkvifujy.supabase.co"; 
    const SUPABASE_KEY = "sb_publishable_WevQJCkdgfwbgnUoNu1SfA_Ec9hT49-";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let mode = 'login';

    function switchTab(newMode) {
      mode = newMode;
      const isReg = mode === 'register';
      
      // Hiện/Ẩn các ô dành riêng cho Đăng ký
      document.getElementById('fullNameGroup').classList.toggle('hidden', !isReg);
      document.getElementById('dobGroup').classList.toggle('hidden', !isReg);
      
      document.getElementById('submitBtn').innerText = isReg ? 'Tạo Tài Khoản Đăng Ký' : 'Đăng Nhập';
      
      document.getElementById('tabLogin').className = isReg ? 'w-1/2 py-2 text-center font-bold text-gray-400' : 'w-1/2 py-2 text-center font-bold text-[#cf1717] border-b-2 border-[#cf1717]';
      document.getElementById('tabRegister').className = isReg ? 'w-1/2 py-2 text-center font-bold text-[#cf1717] border-b-2 border-[#cf1717]' : 'w-1/2 py-2 text-center font-bold text-gray-400';
    }

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const fullName = document.getElementById('fullName').value;
      const dob = document.getElementById('dob').value;
      const msg = document.getElementById('authMsg');

      msg.innerText = "Đang xử lý...";
      msg.className = "mt-4 text-center text-sm font-semibold text-gray-500";

      if (mode === 'register') {
        if (!fullName || !dob) {
          msg.innerText = "Vui lòng điền đầy đủ Họ tên và Ngày sinh!";
          msg.className = "mt-4 text-center text-sm font-semibold text-red-500";
          return;
        }

        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: { 
            data: { full_name: fullName, dob: dob, role: 'student' } 
          }
        });

        if (error) {
          msg.innerText = "Lỗi đăng ký: " + error.message;
          msg.className = "mt-4 text-center text-sm font-semibold text-red-500";
        } else {
          // Lưu vào bảng profiles kèm ngày sinh
          await supabase.from('profiles').insert([{ 
            id: data.user.id, 
            full_name: fullName, 
            dob: dob,
            role: 'student' 
          }]);
          
          msg.innerText = "Đăng ký thành công! Đang chuyển hướng...";
          msg.className = "mt-4 text-center text-sm font-semibold text-green-500";
          setTimeout(() => window.location.href = 'dashboard.html', 1500);
        }
      } else {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
          msg.innerText = "Đăng nhập thất bại: " + error.message;
          msg.className = "mt-4 text-center text-sm font-semibold text-red-500";
        } else {
          window.location.href = 'dashboard.html';
        }
      }
    }
  </script>
</body>
</html>
