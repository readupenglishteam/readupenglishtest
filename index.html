<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IELTS Reading - Trang Chủ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script> tailwind.config = { darkMode: 'class' } </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-300">

  <!-- Header -->
  <header class="bg-white dark:bg-slate-950 border-b border-slate-200 dark:border-slate-800 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center text-white font-bold text-lg">
        <i class="fa-solid fa-book-open"></i>
      </div>
      <span class="font-extrabold text-xl tracking-tight">IELTS <span class="text-red-600">READING</span></span>
    </div>

    <div class="flex items-center gap-4">
      <a href="admin.html" class="text-xs font-semibold hover:text-red-600 transition">Trang Quản Trị</a>
      <!-- Dark mode toggle -->
      <button onclick="toggleTheme()" class="p-2.5 rounded-xl bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:ring-2 ring-red-500 transition">
        <i class="fa-solid fa-sun hidden dark:block"></i>
        <i class="fa-solid fa-moon block dark:hidden"></i>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto p-6 space-y-8">
    <div class="bg-gradient-to-r from-red-600 to-red-800 text-white p-8 rounded-3xl shadow-lg flex justify-between items-center">
      <div>
        <h1 class="text-3xl font-black mb-2">Thư Viện Đề Thi Reading</h1>
        <p class="text-red-100 text-sm">Luyện tập cấu trúc đề thi IELTS thực tế với giao diện tối ưu.</p>
      </div>
    </div>

    <!-- Exam Cards Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm hover:shadow-md transition space-y-4">
        <span class="bg-red-100 dark:bg-red-950 text-red-600 dark:text-red-400 text-xs font-bold px-3 py-1 rounded-full">Passage 1</span>
        <h3 class="font-bold text-lg">The History of Modern Architecture</h3>
        <p class="text-xs text-slate-500 dark:text-slate-400">Thời gian: 20 phút • 13 câu hỏi</p>
        <a href="exam.html" class="block text-center w-full py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold text-xs rounded-xl transition">Vào Làm Bài</a>
      </div>

      <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm hover:shadow-md transition space-y-4">
        <span class="bg-red-100 dark:bg-red-950 text-red-600 dark:text-red-400 text-xs font-bold px-3 py-1 rounded-full">Passage 2</span>
        <h3 class="font-bold text-lg">Climate Change and Biodiversity</h3>
        <p class="text-xs text-slate-500 dark:text-slate-400">Thời gian: 20 phút • 13 câu hỏi</p>
        <a href="exam.html" class="block text-center w-full py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold text-xs rounded-xl transition">Vào Làm Bài</a>
      </div>
    </div>
  </main>

  <script>
    function initTheme() {
      if (localStorage.getItem('theme') === 'light') {
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
      }
    }
    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    }
    initTheme();
  </script>
</body>
</html>
