<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IELTS Reading - Đăng nhập / Đăng ký</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gradient-to-br from-red-50 via-white to-gray-100 dark:bg-zinc-950 dark:text-white min-h-screen transition-colors duration-300">
  
  <header class="flex justify-between items-center p-4 max-w-6xl mx-auto">
    <div class="flex items-center gap-2">
      <img src="https://ibb.co/Zz0KkyYf" alt="Logo" class="h-10">
      <span class="font-bold text-xl text-[#cf1717]">IELTS MASTER</span>
    </div>
    <button id="toggleThemeBtn" class="p-2 rounded-full bg-gray-200 dark:bg-zinc-800">🌙</button>
  </header>

  <main class="flex justify-center items-center py-10 px-4">
    <div class="w-full max-w-md bg-white dark:bg-zinc-900 rounded-2xl shadow-xl p-8 border border-gray-100 dark:border-zinc-800">
      
      <!-- Tab Switcher -->
      <div class="flex border-b border-gray-200 dark:border-zinc-700 mb-6">
        <button id="tabLogin" onclick="switchTab('login')" class="w-1/2 py-2 text-center font-bold text-[#cf1717] border-b-2 border-[#cf1717]">Đăng Nhập</button>
        <button id="tabRegister" onclick="switchTab('register')" class="w-1/2 py-2 text-center font-bold text-gray-400">Đăng Ký</button>
      </div>

      <!-- Form Auth -->
      <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
        <div id="fullNameGroup" class="hidden">
          <label class="block text-xs font-bold uppercase mb-1">Họ và Tên</label>
          <input type="text" id="fullName" placeholder="Nguyễn Văn A" class="w-full p-3 rounded-lg border dark:bg-zinc-800 dark:border-zinc-700">
        </div>

        <div>
          <label class="block text-xs font-bold uppercase mb-1">Email</label>
          <input type="email" id="email" required placeholder="student@example.com" class="w-full p-3 rounded-lg border dark:bg-zinc-800 dark:border-zinc-700">
        </div>

        <div>
          <label class="block text-xs font-bold uppercase mb-1">Mật khẩu</label>
          <input type="password" id="password" required placeholder="••••••••" class="w-full p-3 rounded-lg border dark:bg-zinc-800 dark:border-zinc-700">
        </div>

        <button type="submit" id="submitBtn" class="w-full py-3 bg-[#cf1717] hover:bg-red-700 text-white font-bold rounded-lg transition">
          Đăng Nhập
        </button>
      </form>

      <p id="authMsg" class="mt-4 text-center text-sm font-semibold"></p>
    </div>
  </main>

  <script>
    // Điền URL và Anon Key dự án Supabase của bạn tại đây
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let mode = 'login';

    function switchTab(newMode) {
      mode = newMode;
      const isReg = mode === 'register';
      document.getElementById('fullNameGroup').classList.toggle('hidden', !isReg);
      document.getElementById('submitBtn').innerText = isReg ? 'Đăng Ký Tài Khoản' : 'Đăng Nhập';
      
      document.getElementById('tabLogin').className = isReg ? 'w-1/2 py-2 text-center font-bold text-gray-400' : 'w-1/2 py-2 text-center font-bold text-[#cf1717] border-b-2 border-[#cf1717]';
      document.getElementById('tabRegister').className = isReg ? 'w-1/2 py-2 text-center font-bold text-[#cf1717] border-b-2 border-[#cf1717]' : 'w-1/2 py-2 text-center font-bold text-gray-400';
    }

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const fullName = document.getElementById('fullName').value;
      const msg = document.getElementById('authMsg');

      msg.innerText = "Đang xử lý...";
      msg.className = "mt-4 text-center text-sm font-semibold text-gray-500";

      if (mode === 'register') {
        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: { data: { full_name: fullName, role: 'student' } }
        });

        if (error) {
          msg.innerText = "Lỗi đăng ký: " + error.message;
          msg.className = "mt-4 text-center text-sm font-semibold text-red-500";
        } else {
          // Lưu profile vào bảng profiles
          await supabase.from('profiles').insert([{ id: data.user.id, full_name: fullName, role: 'student' }]);
          msg.innerText = "Đăng ký thành công! Đang chuyển hướng...";
          msg.className = "mt-4 text-center text-sm font-semibold text-green-500";
          setTimeout(() => window.location.href = 'dashboard.html', 1500);
        }
      } else {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
          msg.innerText = "Đăng nhập thất bại: " + error.message;
          msg.className = "mt-4 text-center text-sm font-semibold text-red-500";
        } else {
          window.location.href = 'dashboard.html';
        }
      }
    }
  </script>
</body>
</html>
